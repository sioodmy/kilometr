# Cloudflare: serwerownia rozkładów Kilometr (100% free tier)
name = "kilometr-timetable"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Domyślnie Worker wisi pod darmowym *.workers.dev:
#   https://kilometr-timetable.<twoj-sub>.workers.dev
# Nic nie trzeba ustawiać — działa od razu po `wrangler deploy`.

# ── Własna domena, np. data.kilometr.wroclaw.pl ──────────────────────────
# Da się i jest darmowa, ale wymaga strefy na TYM koncie Cloudflare
# (zakładka Websites → Add domain, plan Free). Potem:
#   1. Przepnij serwery NS u rejestratora na te od Cloudflare
#      (albo — bez ruszania NS — dodaj u siebie rekord CNAME
#      `data` → `kilometr-timetable.<twoj-sub>.workers.dev` z chmurką).
#   2. Odkomentuj poniższe routes i zdeployuj ponownie.
#
# routes = [
#   { pattern = "data.kilometr.wroclaw.pl/*", zone_name = "kilometr.wroclaw.pl" },
# ]

[[r2_buckets]]
binding = "TIMETABLE_BUCKET"
bucket_name = "kilometr-timetable"
