# Cloudflare: serwerownia rozkładów Kilometr (100% free tier)
name = "kilometr-timetable"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Zapasowy adres workers.dev ma zostać włączony mimo routes poniżej
# (bez tej flagi wrangler wyłącza workers.dev przy deployu z routes).
workers_dev = true

# Domyślnie Worker wisi też pod darmowym *.workers.dev:
#   https://kilometr-timetable.<sub>.workers.dev
# Działa od razu po `wrangler deploy` i zostaje jako zapas.

# ── Publiczny adres: data.kilometr.wroclaw.pl ──────────────────────────────
# Strefa kilometr.wroclaw.pl jest na tym samym koncie Cloudflare, więc
# `custom_domain` każe wranglerowi samemu utworzyć rekord DNS i podpiąć
# certyfikat. Dzięki temu buildy APK nie potrzebują zmiennej
# EXPO_PUBLIC_TIMETABLE_URL (adres siedzi w src/services/gtfsConfig.ts).
routes = [
  { pattern = "data.kilometr.wroclaw.pl", custom_domain = true },
]

[[r2_buckets]]
binding = "TIMETABLE_BUCKET"
bucket_name = "kilometr-timetable"
