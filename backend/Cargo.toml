[package]
name = "kilometr-api"
version = "0.1.0"
edition = "2021"
description = "Backend realtime, analityki opoznien i estymacji bez GPS dla aplikacji Kilometr"
license = "GPL-3.0-or-later"

[dependencies]
axum = { version = "0.8", features = ["json", "query", "macros"] }
base64 = "0.22"
dashmap = "6"
jiff = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "brotli", "rustls-tls"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["limit", "timeout"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "compression-br", "trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
urlencoding = "2"

[dev-dependencies]
http-body-util = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
