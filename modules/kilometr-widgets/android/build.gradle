apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'app.kilometr.widgets'
version = '1.0.0'

android {
  namespace "app.kilometr.widgets"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
  compileSdk 36
  testOptions {
    unitTests.includeAndroidResources = true
    unitTests.all {
      if (project.hasProperty('widgetScreenshots')) {
        systemProperty 'kilometr.widget.screenshots', project.property('widgetScreenshots')
      }
    }
  }
}

dependencies {
  implementation "androidx.core:core:1.16.0"
  testImplementation "junit:junit:4.13.2"
  testImplementation "org.robolectric:robolectric:4.17"
}
