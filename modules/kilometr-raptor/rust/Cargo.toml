[package]
name = "kilometr-raptor"
version = "0.1.0"
edition = "2021"
description = "Range RAPTOR transit routing engine for Kilometr"

[lib]
name = "kilometr_raptor"
crate-type = ["cdylib", "staticlib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = "symbols"
