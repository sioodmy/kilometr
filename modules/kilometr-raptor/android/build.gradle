apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

group = 'pl.wroclaw.kilometr.raptor'
version = '1.0.0'

def rustCrateDir = file("${projectDir}/../rust")
def rustJniOutputDir = file("${buildDir}/rustJniLibs")

def reactNativeArchitectures() {
  def value = project.findProperty("reactNativeArchitectures")
  return value
    ? value.toString().split(",").collect { it.trim() }.findAll { !it.isEmpty() }
    : ["arm64-v8a"]
}

def resolveNdkDir() {
  try {
    if (android.ndkDirectory != null && android.ndkDirectory.exists()) {
      return android.ndkDirectory
    }
  } catch (Throwable ignored) {}

  for (envVar in ["ANDROID_NDK_HOME", "ANDROID_NDK_ROOT", "NDK_HOME"]) {
    def val = System.getenv(envVar)
    if (val != null && file(val).exists()) {
      return file(val)
    }
  }

  def sdkDir = null
  try {
    sdkDir = android.sdkDirectory
  } catch (Throwable ignored) {}
  if (sdkDir == null) {
    def sdkEnv = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
    if (sdkEnv != null) {
      sdkDir = file(sdkEnv)
    }
  }

  if (sdkDir != null) {
    def requestedVersion = rootProject.ext.has("ndkVersion") ? rootProject.ext.ndkVersion : null
    if (requestedVersion != null) {
      def versioned = new File(sdkDir, "ndk/${requestedVersion}")
      if (versioned.exists()) {
        return versioned
      }
    }
    def ndkRoot = new File(sdkDir, "ndk")
    if (ndkRoot.exists() && ndkRoot.isDirectory()) {
      def children = ndkRoot.listFiles()?.findAll { it.isDirectory() }?.sort { it.name }
      if (children != null && !children.isEmpty()) {
        return children.last()
      }
    }
  }

  throw new GradleException("Android NDK not found for building kilometr-raptor Rust library.")
}

def resolveCargoBinary() {
  def envCargo = System.getenv("CARGO")
  if (envCargo != null && file(envCargo).exists()) {
    return envCargo
  }
  def homeCargo = new File(System.getProperty("user.home"), ".cargo/bin/cargo")
  if (homeCargo.exists()) {
    return homeCargo.absolutePath
  }
  return "cargo"
}

android {
  namespace "pl.wroclaw.kilometr.raptor"
  compileSdkVersion safeExtGet("compileSdkVersion", 36)

  if (rootProject.ext.has("ndkVersion")) {
    ndkVersion rootProject.ext.ndkVersion
  }

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 36)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }

  sourceSets {
    main {
      jniLibs.srcDirs += [rustJniOutputDir]
    }
  }
}

repositories {
  mavenCentral()
}

dependencies {
  implementation project(':expo-modules-core')
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

tasks.register("compileRustRaptor") {
  inputs.dir(new File(rustCrateDir, "src"))
  inputs.file(new File(rustCrateDir, "Cargo.toml"))
  inputs.property("abis", reactNativeArchitectures().join(","))
  outputs.dir(rustJniOutputDir)

  doLast {
    def ndkDir = resolveNdkDir()
    def prebuiltRoot = new File(ndkDir, "toolchains/llvm/prebuilt")
    def hostDir = prebuiltRoot.listFiles()?.find { it.isDirectory() }
    if (hostDir == null) {
      throw new GradleException("No LLVM prebuilt toolchain found under ${prebuiltRoot}")
    }
    def binDir = new File(hostDir, "bin")
    def minApi = safeExtGet("minSdkVersion", 24)
    def cargoBin = resolveCargoBinary()
    def cargoHomeBin = new File(System.getProperty("user.home"), ".cargo/bin").absolutePath
    def currentPath = System.getenv("PATH") ?: ""

    def abiSpec = [
      "arm64-v8a": [
        rustTarget: "aarch64-linux-android",
        clangPrefix: "aarch64-linux-android${minApi}-clang",
        envKey: "AARCH64_LINUX_ANDROID"
      ],
      "armeabi-v7a": [
        rustTarget: "armv7-linux-androideabi",
        clangPrefix: "armv7a-linux-androideabi${minApi}-clang",
        envKey: "ARMV7_LINUX_ANDROIDEABI"
      ],
      "x86_64": [
        rustTarget: "x86_64-linux-android",
        clangPrefix: "x86_64-linux-android${minApi}-clang",
        envKey: "X86_64_LINUX_ANDROID"
      ],
      "x86": [
        rustTarget: "i686-linux-android",
        clangPrefix: "i686-linux-android${minApi}-clang",
        envKey: "I686_LINUX_ANDROID"
      ]
    ]

    for (abi in reactNativeArchitectures()) {
      def spec = abiSpec[abi]
      if (spec == null) {
        throw new GradleException("Unsupported Android ABI for kilometr-raptor: ${abi}")
      }
      def linker = new File(binDir, spec.clangPrefix)
      def ar = new File(binDir, "llvm-ar")
      if (!linker.exists()) {
        throw new GradleException("NDK Clang linker not found at ${linker.absolutePath}")
      }

      exec {
        workingDir rustCrateDir
        environment "PATH", "${cargoHomeBin}${File.pathSeparator}${binDir.absolutePath}${File.pathSeparator}${currentPath}"
        environment "CC_${spec.rustTarget.replace('-', '_')}", linker.absolutePath
        environment "AR_${spec.rustTarget.replace('-', '_')}", ar.absolutePath
        environment "CARGO_TARGET_${spec.envKey}_LINKER", linker.absolutePath
        environment "CARGO_TARGET_${spec.envKey}_AR", ar.absolutePath
        commandLine cargoBin, "build", "--release", "--target", spec.rustTarget
      }

      def builtSo = new File(rustCrateDir, "target/${spec.rustTarget}/release/libkilometr_raptor.so")
      if (!builtSo.exists()) {
        throw new GradleException("Expected Rust shared library missing at ${builtSo.absolutePath}")
      }
      def destDir = new File(rustJniOutputDir, abi)
      destDir.mkdirs()
      copy {
        from builtSo
        into destDir
      }
    }
  }
}

afterEvaluate {
  tasks.matching { it.name == "preBuild" }.configureEach {
    dependsOn("compileRustRaptor")
  }
}
