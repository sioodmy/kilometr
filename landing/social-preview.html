<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200" />
    <meta name="robots" content="noindex" />
    <title>%PAGE_TITLE%</title>
    <script>
      localStorage.setItem('kilometr.website.language', 'pl');
    </script>
    <style>
      html,
      body,
      #root,
      .hero-release {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
      .hero-release {
        padding: 0 48px;
      }
      .hero-map-stage {
        height: 630px;
      }
      .release-nav {
        position: absolute;
        top: 40px;
        left: 52px;
        padding: 0;
      }
      .release-brand {
        gap: 12px;
        font-size: 25px;
      }
      .release-brand-mark {
        width: 38px;
        height: 38px;
        border-radius: 11px;
      }
      .hero-content {
        max-width: 1000px;
        margin: 104px auto 0;
      }
      .hero-title {
        margin: 0;
        font-size: 64px;
        line-height: 1.04;
      }
      .hero-subtitle {
        margin-top: 16px;
        font-size: 21px;
      }
      .hero-cta {
        display: none;
      }
      .hero-hardware-stage {
        margin-top: 34px;
      }
      .hero-hardware-stage::before {
        top: 0;
        height: 60%;
      }
      .hero-centerpiece {
        width: 300px;
        transform: none;
      }
      .hero-flank {
        width: 262px;
      }
      .hero-flank-left {
        transform: translateY(34px) translateX(12px) rotateY(11deg) rotateZ(-2.5deg) scale(0.94);
      }
      .hero-flank-right {
        transform: translateY(34px) translateX(-12px) rotateY(-11deg) rotateZ(2.5deg) scale(0.94);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { createElement } from 'react';
      import { createRoot } from 'react-dom/client';
      import { Hero } from './src/components/Hero';
      import './src/styles.css';

      createRoot(document.getElementById('root')).render(createElement(Hero));
    </script>
  </body>
</html>
