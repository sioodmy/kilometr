<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafbf9" />
    <meta name="description" content="%PAGE_DESCRIPTION%" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icon.png" />
    <link rel="canonical" href="https://sioodmy.github.io/kilometr/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pl_PL" />
    <meta property="og:site_name" content="Kilometr" />
    <meta property="og:title" content="%PAGE_TITLE%" />
    <meta property="og:description" content="%PAGE_DESCRIPTION%" />
    <meta property="og:url" content="https://sioodmy.github.io/kilometr/" />
    <meta property="og:image" content="https://sioodmy.github.io/kilometr/social-preview.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>%PAGE_TITLE%</title>
    <script>
      try {
        const preference = localStorage.getItem('kilometr.website.theme');
        document.documentElement.dataset.theme =
          preference === 'dark' ||
          (preference !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
            ? 'dark'
            : 'light';
      } catch {
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript
      ><p>%NO_SCRIPT%</p>
      <a href="https://play.google.com/store/apps/details?id=my.siood.kilometr"
        >%PLAY_LABEL%</a
      ></noscript
    >
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
