<html>

    <meta name="robots" content="noindex" />

      (function () {
        var h = location.hash ? location.hash.slice(1) : '';
        var nextHash = h && h.indexOf('=') === -1 ? '#t=' + h : location.hash;
        location.replace('../' + location.search + nextHash);
      })();
    </script>
