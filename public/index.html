    <meta name="twitter:card" content="summary_large_image" />

      name="twitter:description"
      content="Rozkłady jazdy komunikacji miejskiej i kolei w Polsce. Mapa na żywo, szybki planer połączeń i praca offline."

    <meta name="twitter:image:alt" content="Kilometr: planer połączeń komunikacji miejskiej i kolei w Polsce" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <title>Kilometr</title>
    <style id="expo-reset">
      :root {
        --km-sat: env(safe-area-inset-top, 0px);
        --km-sar: env(safe-area-inset-right, 0px);
        --km-sab: env(safe-area-inset-bottom, 0px);
        --km-sal: env(safe-area-inset-left, 0px);
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: var(--km-vvh, 100dvh);
        background-color: #111414;
        color: #E0E3E1;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      #root {
        display: flex;
        flex: 1;
        flex-direction: column;
        width: 100%;
        height: 100%;
        height: var(--km-vvh, 100dvh);
        background-color: #111414;
        position: relative;
        overflow: hidden;
      }
      @media (hover: hover) and (pointer: fine) {
        button,
        [role='button'],
        [role='tab'],
        [role='radio'],
        [role='checkbox'],
        [role='switch'],
        [role='link'],
        [role='menuitem'],
        a {
          cursor: pointer;
        }
        [aria-disabled='true'] {
          cursor: default;
        }
      }
      * {
        -webkit-tap-highlight-color: transparent;
        scrollbar-width: thin;
        scrollbar-color: #3F4946 transparent;
      }
      @media (pointer: coarse) {
        * {
          scrollbar-width: none;
        }
        *::-webkit-scrollbar {
          display: none;
        }
      }
      button:focus-visible,
      [role='button']:focus-visible,
      a:focus-visible {
        outline: 2px solid #5CDBBE;
        outline-offset: 2px;
      }
      input:focus,
      input:focus-visible,
      textarea:focus,
      textarea:focus-visible {
        outline: none;
        box-shadow: none;
      }
      #km-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #111414;
        transition: opacity 220ms ease-out;
      }
      #km-boot-splash.km-hide {
        opacity: 0;
        pointer-events: none;
      }
      #km-boot-splash img {
        width: 134px;
        height: 134px;
        border-radius: 30px;
      }
    </style>
  </head>
  <body>
    <noscript>Kilometr wymaga włączonego JavaScriptu.</noscript>
    <div id="km-boot-splash" aria-hidden="true">
      <img src="/icons/splash-icon.png" alt="" width="134" height="134" />
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var vv = window.visualViewport;
        if (vv) {
          var sync = function () {
            document.documentElement.style.setProperty('--km-vvh', Math.round(vv.height) + 'px');
            if (window.scrollY !== 0 || window.scrollX !== 0) {
              window.scrollTo(0, 0);
            }
          };
          sync();
          vv.addEventListener('resize', sync);
          vv.addEventListener('scroll', sync);
          window.addEventListener(
            'scroll',
            function () {
              if (window.scrollY !== 0 || window.scrollX !== 0) {
                window.scrollTo(0, 0);
              }
            },
            { passive: true },
          );
        }
      })();
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
