version: 2
updates:
  # Bumpy zależności wpadają przez gałąź integracyjną `dev`,
  # potem promocja PR-ami: dev -> main -> nightly -> prod.
  # Zależności aplikacji mobilnej
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Zależności backendu (server)
  - package-ecosystem: "npm"
    directory: "/server"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Zależności landing page
  - package-ecosystem: "npm"
    directory: "/landing"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Aktualizacje GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
