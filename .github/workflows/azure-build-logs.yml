name: Azure build logs (temporary)

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Azure build logs
        env:
          AZDO_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
        run: |
          set -euo pipefail
          BASE="https://dev.azure.com/kilometr/450300a8-a3cd-4717-b55c-2ab2c702ec76/_apis/build/builds/28"
          curl -fsSL -u ":${AZDO_PAT}" -H "Accept: application/json" "${BASE}/logs?api-version=7.1" -o /tmp/logs.json
          mkdir -p /tmp/logs
          node -e '
            const body = require("/tmp/logs.json");
            const logs = body.value || body;
            for (const l of logs) console.log(l.id);
          ' > /tmp/ids.txt
          echo "Logs: $(wc -l < /tmp/ids.txt)"
          while read -r ID; do
            curl -fsSL -u ":${AZDO_PAT}" "${BASE}/logs/${ID}?api-version=7.1" -o "/tmp/logs/${ID}" || true
          done < /tmp/ids.txt
          echo "=== ERRORS ==="
          grep -n -i -E "error|failure|what went wrong|caused by|exception" /tmp/logs/* | tail -200 || true
          echo "=== LOG 18 TAIL ==="
          tail -n 300 /tmp/logs/18 || true
