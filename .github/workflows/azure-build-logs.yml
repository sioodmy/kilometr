name: Azure build logs (temporary)

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Azure build logs
        env:
          AZDO_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
        run: |
          set -euo pipefail
          URL="https://dev.azure.com/kilometr/450300a8-a3cd-4717-b55c-2ab2c702ec76/_apis/build/builds/28/logs?api-version=7.1"
          curl -fsSL -u ":${AZDO_PAT}" "$URL" -o /tmp/logs.zip
          unzip -o -q /tmp/logs.zip -d /tmp/logs
          ls -la /tmp/logs | head -40
          echo "=== ERRORS ==="
          grep -n -i -E "error|failure|what went wrong|caused by|exception" /tmp/logs/* | tail -120 || true
          echo "=== LOG 18 TAIL ==="
          tail -n 300 /tmp/logs/18 || true
