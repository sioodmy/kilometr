name: Commitlint

# Notki wydań budują się z conventional commitów, więc format jest bramką.
# Sprawdza commity z PR-a (bez merge commitów, patrz commitlint.config.mjs).
on:
  pull_request:
    branches:
      - dev
      - main
      - nightly
      - prod

jobs:
  lint-commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint commit messages
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
