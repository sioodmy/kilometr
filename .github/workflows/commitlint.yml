name: Commitlint

# Notki wydań budują się z conventional commitów, więc format jest bramką.
# Sprawdza commity z PR-a (bez merge commitów, patrz commitlint.config.mjs).
on:
  pull_request:
    branches:
      - dev
      - main
      - nightly
      - prod

permissions:
  contents: read

concurrency:
  group: commitlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js & install dependencies
        uses: ./.github/actions/setup-node-ci

      - name: Lint commit messages
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
