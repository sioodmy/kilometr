# Budowanie, walidacja i publikacja wskazówek lokalizacyjnych przystanków (stop-hints) → Cloudflare R2.
#
# Działa przy zmianie w plikach źródłowych cloudflare/data/stop-hints-*.json lub na żądanie.
# Waliduje spójność antislop, kompiluje JSON i wrzuca do R2 (kilometr-timetable/<city>/stop-hints.json).

name: Stop hints → R2

on:
  push:
    paths:
      - 'cloudflare/data/stop-hints-*.json'
      - 'cloudflare/scripts/*stop-hints*.mjs'
      - '.github/workflows/stop-hints.yml'
  workflow_dispatch:
    inputs:
      city:
        description: 'Miasto (puste = wszystkie zdefiniowane)'
        required: false
        default: 'wroclaw'
        type: choice
        options: ['wroclaw']

permissions:
  contents: read
  issues: write

concurrency:
  group: stop-hints-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build, validate & upload stop hints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Walidacja i kompilacja wskazówek
        run: |
          CITY="${{ inputs.city || 'wroclaw' }}"
          echo "Kompilacja dla miasta: $CITY"
          node cloudflare/scripts/build-stop-hints.mjs --city="$CITY"

      - name: Uruchomienie Canary (kontrola brakujących węzłów)
        run: |
          CITY="${{ inputs.city || 'wroclaw' }}"
          node cloudflare/scripts/check-stop-hints.mjs --city="$CITY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload do Cloudflare R2
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          CITY="${{ inputs.city || 'wroclaw' }}"
          FILE="cloudflare/dist/$CITY/stop-hints.json"
          if [ -f "$FILE" ]; then
            echo "Wysyłanie $FILE do R2 (kilometr-timetable/$CITY/stop-hints.json)..."
            npx -y wrangler@3.114.0 r2 object put "kilometr-timetable/$CITY/stop-hints.json" \
              --file="$FILE" --content-type "application/json"
          else
            echo "Brak pliku $FILE do wysłania!"
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
