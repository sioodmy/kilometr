name: Build unsigned F-Droid APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Wersja APK w formacie vX.Y.Z'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fdroid-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ inputs.version }}
      FDROID_BUILD: '1'
      BUILD_NUMBER: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.30.5'
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - run: npm ci
      - run: npm run prebuild:fdroid
      - run: npm run check:fdroid
      - name: Build unsigned APK
        working-directory: android
        run: |
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64,x86 \
            -Dorg.gradle.jvmargs='-Xmx4g -XX:MaxMetaspaceSize=1g' \
            -x lint --no-daemon --console=plain
      - name: Check manifest and dependencies
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK" > "$RUNNER_TEMP/permissions.txt"
          npm run check:android-permissions -- "$RUNNER_TEMP/permissions.txt"
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"; then
            echo '::error::APK F-Droid musi być niepodpisane.'
            exit 1
          fi
          cd android
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --console=plain > "$RUNNER_TEMP/dependencies.txt"
          if grep -E 'com\.google\.(firebase|android\.gms)|com\.android\.installreferrer' "$RUNNER_TEMP/dependencies.txt"; then
            echo '::error::W APK pozostały zależności Google.'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: kilometr-fdroid-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
