name: Build Play AAB

# AAB (Android App Bundle) do Google Play Console:
# Testing -> Internal testing -> New release -> Upload app-release.aab.
# Bundle jest podpisywany kluczem upload z sekretów repo.
#
# Prod buduje AAB automatycznie i dołącza go do wydania GitHub razem z APK
# i IPA (build-apk.yml -> workflow_dispatch z release_tag).
# Ręczny workflow_dispatch z dowolnej gałęzi kończy się na artefakcie Actions:
# bez release'u i tagu, do wgrania w Play Console.
#
# Sekrety (Settings -> Secrets and variables -> Actions -> Repository secrets):
#   ANDROID_KEYSTORE_BASE64       - klucz upload zakodowany base64
#   ANDROID_KEYSTORE_PASSWORD     - hasło keystore'a
#   ANDROID_KEYSTORE_ALIAS        - alias klucza w keystore
#   ANDROID_KEYSTORE_KEY_PASSWORD - hasło klucza (opcjonalne, domyślnie
#                                   jak ANDROID_KEYSTORE_PASSWORD)
on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Architektura procesora (arm64-v8a to 99% nowoczesnych telefonów)'
        required: true
        default: 'all'
        type: choice
        options:
          - 'arm64-v8a'
          - 'all'
      release_tag:
        description: 'Tag wydania prod; puste pole zapisuje wyłącznie artefakt Actions'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: build-play-aab
  cancel-in-progress: false

env:
  # Wersje muszą być zgodne z node_modules/react-native/gradle/libs.versions.toml
  # (compileSdk/targetSdk=36, buildTools=36.0.0, ndkVersion=27.1.12297006)
  # oraz z CMAKE_VERSION używanym przez react-native (3.30.5).
  ANDROID_COMPILE_SDK: '36'
  ANDROID_BUILD_TOOLS: '36.0.0'
  ANDROID_NDK: '27.1.12297006'
  ANDROID_CMAKE: '3.30.5'
  BUILD_NUMBER: ${{ github.run_attempt }}
  # Pierwszy run po v1.5.2: 56. Każdy kolejny rezerwuje 100 kodów na ponowienia.
  PLAY_RUN_NUMBER_BASE: '56'
  PLAY_VERSION_CODE_BASE: '701050201'
  # Podpis release: hasła i alias muszą widzieć prebuild (wtyczka z bramką
  # sekretów) i gradle (kto czyta je dopiero w chwili builda). KEY_PASSWORD
  # może zostać pusty, wtedy klucz użyje hasła keystore.
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
  ANDROID_KEYSTORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}

jobs:
  build-aab:
    name: Build & Sign Play AAB
    runs-on: ubuntu-latest
    steps:
      # Pełna historia, żeby versionCode (minuty od 2020) miał sensowny
      # krótki SHA w versionName.
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # AAB trafia do testerów z Google Play, więc gra tymi samymi regułami
      # co wydania APK: bez realnego KD (MPK-only/atrapa) nie budujemy.
      - name: Verify timetable has real KD
        env:
          TIMETABLE_URL: ${{ vars.TIMETABLE_URL }}
        run: |
          set -euo pipefail
          URL="${TIMETABLE_URL:-https://data.kilometr.app}/wroclaw/manifest.json"
          if ! curl -fsS --max-time 20 "$URL" -o /tmp/timetable-manifest.json; then
            echo "::warning::Nie mogę pobrać manifestu rozkładu ($URL). Pomijam weryfikację KD."
            exit 0
          fi
          node -e '
            const m = require("/tmp/timetable-manifest.json");
            const kd = (m.sources && m.sources.kd) || {};
            const stations = Number(kd.stations || 0);
            const trips = Number(kd.trips || 0);
            if (kd.skippedReason || stations <= 0 || trips <= 0) {
              console.error("::error::Manifest bez realnego KD (skippedReason=" + (kd.skippedReason || "null") + ", stations=" + stations + ", trips=" + trips + "). Nie buduję AAB na bazie bez KD.");
              process.exit(1);
            }
            console.log("KD OK: stations=" + stations + ", routes=" + (kd.routes || 0) + ", trips=" + trips + ", interchanges=" + (kd.interchanges || 0));
          '

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      # Bez `packages` domyślnie: pakiet `tools` usunięto z repozytorium
      # Google, sdkmanager kończy się błędem "Failed to find package 'tools'".
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK platforms, build-tools, NDK and CMake
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}" \
            "cmake;${ANDROID_CMAKE}"

      - name: Install Node dependencies
        run: npm ci

      - name: Test Android permission gate
        run: npm run check:permission-gate

      - name: Test Android version codes
        run: node --test scripts/check-android-version-code.test.mjs

      # Wszystkie AAB korzystają z licznika tego workflow, niezależnie od kanału.
      - name: Resolve version and versionCode
        id: version
        env:
          INPUT_ARCH: ${{ inputs.arch }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_RUN_NUMBER" -lt "$PLAY_RUN_NUMBER_BASE" ] || [ "$GITHUB_RUN_ATTEMPT" -gt 99 ]; then
            echo "::error::Nieprawidłowy licznik AAB. Uruchom nowy workflow zamiast starego podejścia."
            exit 1
          fi
          ANDROID_VERSION_CODE=$((PLAY_VERSION_CODE_BASE + (GITHUB_RUN_NUMBER - PLAY_RUN_NUMBER_BASE) * 100 + GITHUB_RUN_ATTEMPT))
          export ANDROID_VERSION_CODE
          echo "ANDROID_VERSION_CODE=$ANDROID_VERSION_CODE" >> "$GITHUB_ENV"
          ARCH="${INPUT_ARCH:-all}"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          if [ -n "${RELEASE_TAG:-}" ]; then
            if [ "$GITHUB_REF_NAME" != prod ] || ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Publikacja AAB wymaga gałęzi prod i tagu vX.Y.Z."
              exit 1
            fi
            # Prod: versionName musi zgadzać się z tagiem wydania (vX.Y.Z),
            # do którego dołączamy AAB.
            VERSION="$RELEASE_TAG"
          else
            VERSION="play-$(date -u +%Y%m%d-%H%M)-${SHORT_SHA}"
          fi
          VERSION_CODE="$(APP_VERSION="$VERSION" node -e "process.stdout.write(String(require('./app.config.js')({}).android.versionCode))")"
          echo "arch=$ARCH" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "aab_name=app-release.aab" >> "$GITHUB_OUTPUT"
          echo "Play: versionName=$VERSION versionCode=$VERSION_CODE arch=$ARCH"

      - name: Setup Rust toolchain and Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ steps.version.outputs.arch == 'arm64-v8a' && 'aarch64-linux-android' || 'aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android' }}

      - name: Cache Rust RAPTOR target
        uses: actions/cache@v4
        with:
          path: modules/kilometr-raptor/rust/target
          key: rust-raptor-${{ runner.os }}-${{ steps.version.outputs.arch }}-${{ hashFiles('modules/kilometr-raptor/rust/Cargo.toml', 'modules/kilometr-raptor/rust/src/**') }}
          restore-keys: |
            rust-raptor-${{ runner.os }}-${{ steps.version.outputs.arch }}-
            rust-raptor-${{ runner.os }}-

      - name: Test Rust RAPTOR engine
        run: cargo test --manifest-path modules/kilometr-raptor/rust/Cargo.toml

      # Klucz upload ląduje w RUNNER_TEMP poza workspace: runner czyści katalog
      # po budzie, a pliku keystore nigdy nie powinno być w repo.
      - name: Decode upload keystore from secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: |
          set -euo pipefail
          for V in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS; do
            if [ -z "${!V:-}" ]; then
              echo "::error::Brak sekretu repo zależnego od $V. Wgraj ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD i ANDROID_KEYSTORE_ALIAS w Settings -> Secrets and variables -> Actions."
              exit 1
            fi
          done
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-key.jks"
          echo "Klucz upload zdekodowany: $RUNNER_TEMP/upload-key.jks"

      - name: Expo Prebuild
        env:
          # Wersja i versionCode z kroków wyżej; app.config.js czyta APP_VERSION.
          APP_VERSION: ${{ steps.version.outputs.version }}
          # Sekrety haseł i aliasu są na poziomie joba (gradle czyta je z env
          # w chwili builda). Tu wtyczka withAndroidSigning potrzebuje jeszcze
          # ścieżki, a runner context działa wyłącznie w env kroku.
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-key.jks
        run: npx expo prebuild --platform android --clean --no-install

      - name: Tune Gradle for CI
        run: |
          set -euo pipefail
          GP=android/gradle.properties
          # Domyślne 2 GB JVM za mało dla równoległej kompilacji C++ (RN 0.86, new arch).
          # expo prebuild generuje gradle.properties bez końcowej nowej linii, więc
          # najpierw printf, potem doklejka inaczej zlepiłoby się w jedną wartość.
          printf '\n' >> "$GP"
          cat >> "$GP" <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
          org.gradle.caching=true
          EOF

      - name: Build Android App Bundle
        env:
          TARGET_ARCH: ${{ steps.version.outputs.arch }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ARCH_FLAG=""
          if [ "$TARGET_ARCH" = "arm64-v8a" ]; then
            echo "Szybki build: kompilacja tylko pod arm64-v8a (Play zrobi splity per urządzenie)"
            ARCH_FLAG="-PreactNativeArchitectures=arm64-v8a"
          else
            echo "Pełny build: wszystkie architektury"
          fi

          cd android
          chmod +x gradlew
          ./gradlew bundleRelease -x lint --no-daemon --console=plain --stacktrace $ARCH_FLAG

      - name: Verify signed AAB
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB" ]; then
            echo "::error::Nie znaleziono $AAB"
            exit 1
          fi
          echo "Wersja deklarowana: versionName=$VERSION versionCode=$VERSION_CODE"
          echo "AAB: $(du -h "$AAB" | cut -f1)"
          # Gradle podpisuje bundle jarsignerem (v1); brak "jar verified" znaczy,
          # że signingConfig nie wszedł i Play taki plik odrzuci.
          if ! jarsigner -verify "$AAB" 2>&1 | grep -q "jar verified"; then
            echo "::error::AAB nie jest podpisany kluczem upload. Sprawdź sekrety ANDROID_KEYSTORE_*."
            exit 1
          fi
          echo "jarsigner: podpis ok"

      - name: 'Gate: AAB tylko z potrzebnymi uprawnieniami Androida'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          TARGET_ARCH: ${{ steps.version.outputs.arch }}
        run: |
          set -euo pipefail
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          curl -fL --retry 3 https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar -o "$RUNNER_TEMP/bundletool.jar"
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$AAB" --module=base > "$RUNNER_TEMP/aab-manifest.xml"
          npm run check:android-permissions -- "$RUNNER_TEMP/aab-manifest.xml" --xml
          python3 - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          import zipfile

          android = '{http://schemas.android.com/apk/res/android}'
          manifest = ET.parse(os.environ['RUNNER_TEMP'] + '/aab-manifest.xml').getroot()
          assert manifest.get('package') == 'app.kilometr', 'Nieprawidłowy package AAB'
          assert manifest.get(android + 'versionName') == os.environ['VERSION'], 'Nieprawidłowy versionName AAB'
          assert manifest.get(android + 'versionCode') == os.environ['VERSION_CODE'], 'Nieprawidłowy versionCode AAB'
          with zipfile.ZipFile('android/app/build/outputs/bundle/release/app-release.aab') as bundle:
              embedded = json.loads(bundle.read('base/assets/app.config'))
              assert embedded['version'] == os.environ['VERSION'], 'Nieprawidłowa wersja w assets/app.config'
              abis = {path.split('/')[2] for path in bundle.namelist() if path.startswith('base/lib/') and path.endswith('/libkilometr_raptor.so')}
          expected = {'arm64-v8a'} if os.environ['TARGET_ARCH'] == 'arm64-v8a' else {'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'}
          assert abis == expected, f'Niepełne architektury silnika RAPTOR: {abis}, oczekiwano {expected}'
          print(f'AAB OK: versionName={os.environ["VERSION"]}, versionCode={os.environ["VERSION_CODE"]}, arch={sorted(abis)}')
          PY

      - name: Stage AAB
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          mkdir -p aab-dist
          cp android/app/build/outputs/bundle/release/app-release.aab aab-dist/app-release.aab
          # R8 obfuskuje nazwy; bez mapping.txt stosy z Play są nieczytelne.
          # Plik wgrywa się osobno w Play Console razem z wydaniem.
          MAPPING=android/app/build/outputs/mapping/release/mapping.txt
          if [ -f "$MAPPING" ]; then
            cp "$MAPPING" aab-dist/mapping.txt
          else
            echo "::error::Brak $MAPPING, R8 nie zostawił pliku mapowania."
            exit 1
          fi
          (cd aab-dist && sha256sum app-release.aab > app-release.aab.sha256)
          {
            echo "versionName=$VERSION"
            echo "versionCode=$VERSION_CODE"
          } > aab-dist/version.txt
          ls -lh aab-dist

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kilometr-play-aab
          path: aab-dist/*
          if-no-files-found: error

      - name: Summarize
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          echo "### AAB dla Google Play (podpisany kluczem upload)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "versionName: \`$VERSION\` | versionCode: \`$VERSION_CODE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pobierz \`app-release.aab\` z dołu tej strony (Artifacts: \`kilometr-play-aab\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "i wgraj w: Play Console -> Testing -> Internal testing -> Create new release." >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Attach AAB to release
    needs: build-aab
    if: inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kilometr-play-aab
          path: aab-dist
      - name: Attach to prod release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME:$RELEASE_TAG" in
            prod:v*) ;;
            *) echo "::error::AAB można opublikować wyłącznie w wydaniu prod."; exit 1 ;;
          esac
          cd aab-dist
          mv app-release.aab kilometr-prod.aab
          rm -f app-release.aab.sha256
          sha256sum kilometr-prod.aab > kilometr-prod.aab.sha256

          gh release view "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" \
            kilometr-prod.aab \
            kilometr-prod.aab.sha256 \
            --clobber
          gh release view "$RELEASE_TAG" --json assets --jq '[.assets[].name]'
