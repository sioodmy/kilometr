# Ręczny build pakietu kafelków mapy (Wrocław) → Cloudflare R2.
#
# Uruchamiaj rzadko i ręcznie: kafle OSM zmieniają się powoli, a pakiet waży
# ~31 MB. Gdy go odpalasz z gałęzi innej niż domyślna, wybierz tę gałąź
# w „Run workflow".
#
# Wymagane sekrety (te same co timetable.yml):
#   CLOUDFLARE_API_TOKEN   token z uprawnieniem R2 write na bucket kilometr-timetable
#   CLOUDFLARE_ACCOUNT_ID  id konta Cloudflare
#
# Bez sekretów Cloudflare workflow kończy się na artefakcie Actions
# (do ręcznego wgrania) — R2 nie jest dotykane.
#
# Po wgraniu telefon pobiera pakiet z https://data.kilometr.wroclaw.pl/maps/wroclaw-tiles.ktp
# (Worker kilometr-timetable serwuje ten klucz z R2).

name: Map tiles build → R2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: map-tiles-build
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build tile pack + upload R2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build tile pack (Wrocław, z0-14)
        run: |
          mkdir -p dist
          node scripts/build-tile-pack.mjs dist/wroclaw-tiles.ktp

      - name: Summary
        run: |
          SIZE=$(du -h dist/wroclaw-tiles.ktp | cut -f1)
          echo "### Pakiet kafelków: ${SIZE}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node -e "const fs=require('fs');const b=fs.readFileSync('dist/wroclaw-tiles.ktp');console.log(JSON.stringify({kafelkow:b.readUInt32LE(8),maxzoom:b.readUInt32LE(12),rozmiarMB:+(b.length/1048576).toFixed(1)}))" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Artefakt (7 dni, do ręcznego wgrania)
        uses: actions/upload-artifact@v4
        with:
          name: wroclaw-tiles
          path: dist/wroclaw-tiles.ktp
          retention-days: 7

      - name: Upload → R2
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Brak sekretu CLOUDFLARE_API_TOKEN — pomijam upload do R2. Pakiet jest w artefakcie."
            exit 0
          fi
          npx -y wrangler@3.114.0 r2 object put kilometr-timetable/maps/wroclaw-tiles.ktp \
            --file=dist/wroclaw-tiles.ktp --content-type application/octet-stream
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
