# Tygodniowe odświeżanie snapshotów POI w R2.
#
# Build rozkładu ma POI tylko jako dodatek: czyta cache z R2, a gdy go brak,
# próbuje Overpassa. Ten workflow pilnuje, żeby cache w R2 nie wygasł i żeby
# brakujące miasta dostały snapshot bez czekania na kolejny build rozkładu.
#
# Snapshot trafia do `kilometr-timetable/{miasto}/pois.json.gz`; klient go nie
# pobiera, to cache dla buildów (POI siedzą w bazie SQLite).

name: POI refresh → R2

on:
  schedule:
    # Wtorek 02:37 UTC, dzień po buildzie rozkładów.
    - cron: '37 2 * * 2'
  workflow_dispatch:
    inputs:
      city:
        description: 'Miasto (puste = wszystkie)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: poi-refresh
  cancel-in-progress: false

jobs:
  list:
    name: Lista miast
    runs-on: ubuntu-latest
    outputs:
      cities: ${{ steps.list.outputs.cities }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Miasta z rejestru
        id: list
        run: echo "cities=$(node cloudflare/scripts/list-cities.mjs)" >> "$GITHUB_OUTPUT"

  refresh:
    name: POI (${{ matrix.city }})
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        city: ${{ (github.event_name == 'workflow_dispatch' && inputs.city != '') && fromJSON(format('["{0}"]', inputs.city)) || fromJSON(needs.list.outputs.cities) }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Publikacja tylko z main
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "::error::Publikacja do R2 tylko z main (jest: $GITHUB_REF_NAME)."
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::notice::Build z $GITHUB_REF_NAME: tylko sprawdzenie, bez uploadu do R2."
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Refresh snapshotu POI (${{ matrix.city }})
        id: refresh
        run: |
          set +e
          node cloudflare/scripts/refresh-pois.mjs --city=${{ matrix.city }}
          code=$?
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then
            echo "### Bez zmian (skip) (${{ matrix.city }})" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$code"
        env:
          TIMETABLE_PUBLIC_URL: ${{ secrets.TIMETABLE_PUBLIC_URL }}

      - name: Snapshot POI → R2
        if: github.ref_name == 'main' && steps.refresh.outputs.exit == '0'
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Brak sekretu CLOUDFLARE_API_TOKEN - pomijam upload snapshotu POI do R2."
            exit 0
          fi
          FILE="cloudflare/dist/poi-cache/${{ matrix.city }}.json.gz"
          if [ ! -s "$FILE" ]; then
            echo "Brak snapshotu POI na dysku, zostawiam poprzedni w R2."
            exit 0
          fi
          node -e 'const fs=require("node:fs"),z=require("node:zlib");const s=JSON.parse(z.gunzipSync(fs.readFileSync(process.argv[1])));if(!(s.count>0&&Array.isArray(s.rows)&&s.rows.length===s.count))process.exit(1)' "$FILE" || {
            echo "Pusty snapshot POI, nie nadpisuję R2."
            exit 0
          }
          npx -y wrangler@3.114.0 r2 object put "kilometr-timetable/${{ matrix.city }}/pois.json.gz" \
            --file="$FILE" --content-type application/gzip
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Podsumowanie
        if: steps.refresh.outputs.exit == '0'
        run: |
          {
            echo '```'
            echo "POI (${{ matrix.city }}): $(stat -c%s "cloudflare/dist/poi-cache/${{ matrix.city }}.json.gz") B"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
