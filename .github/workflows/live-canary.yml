name: Canary źródeł live

# Codzienny smoke test żywych źródeł (MPK bus_position, zbiorkom.live). Łapie
# zmianę schematu albo padnięte źródło, zanim zauważą to użytkownicy. Przy
# awarii otwiera issue: jeden na dzień, bez spamu.
on:
  schedule:
    # Codziennie nad ranem, poza innymi harmonogramami.
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  canary:
    name: Odpytanie źródeł live
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Odpytaj źródła
        id: probe
        continue-on-error: true
        run: |
          set -o pipefail
          npx tsx --require ./scripts/stub-expo.cjs scripts/check-live-canary.ts 2>&1 | tee canary.log

      - name: Otwórz issue przy awarii
        if: steps.probe.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TITLE="Canary live: źródło nie odpowiada ($(date -u +%Y-%m-%d))"
          EXISTING=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "Issue już istnieje, pomijam."
          else
            gh issue create --title "$TITLE" --body-file canary.log
          fi
          exit 1
