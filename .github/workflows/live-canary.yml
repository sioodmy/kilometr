name: Canary źródeł live

# Codzienny smoke test żywych źródeł (MPK bus_position, zbiorkom.live). Łapie
# zmianę schematu albo padnięte źródło, zanim zauważą to użytkownicy. Przy
# awarii aktualizuje jeden stały issue zamiast tworzyć nowy każdego dnia.
on:
  schedule:
    # Codziennie nad ranem, poza innymi harmonogramami.
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  canary:
    name: Odpytanie źródeł live
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Odpytaj źródła
        id: probe
        continue-on-error: true
        run: |
          set -o pipefail
          npx tsx --require ./scripts/stub-expo.cjs scripts/check-live-canary.ts 2>&1 | tee canary.log

      - name: Otwórz albo zaktualizuj issue przy awarii
        if: steps.probe.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TITLE="Canary live: źródło nie odpowiada"
          NUMBER=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUMBER" ]; then
            echo "Issue #$NUMBER już istnieje, dopisuję log."
            gh issue comment "$NUMBER" --body-file canary.log
          else
            gh issue create --title "$TITLE" --body-file canary.log
          fi
          exit 1
