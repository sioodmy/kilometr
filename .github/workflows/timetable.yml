# Codzienny build prebuilt SQLite per-miasto → Cloudflare R2.
#
# Macierz: wroclaw (MPK + KD z PDP), krakow (3 feedy ZTP + KMŁ),
# gzm (eksporty dzienne ZTM z CKAN + KŚ) i warszawa (GTFS WTP + KM/WKD z PDP),
# poznan (GTFS ZTM + KW ze statycznych feedów), trojmiasto (GTFS ZTM Gdańsk
# + ZKM Gdynia + SKM ze statycznych feedów), lodz (GTFS ZDiT + ŁKA
# ze statycznych feedów), szczecin (GTFS ZDiTM ze statycznego feedu,
# bez kolei), kielce (GTFS ZTM ze statycznego feedu, bez kolei), olsztyn (GTFS ZDZiT z mirrora, bez kolei), bialystok (GTFS BKM ze statycznego feedu, bez kolei), opole (GTFS MZK ze statycznego feedu, bez kolei), rzeszow (GTFS ZTM ze statycznego feedu, bez kolei), lublin (GTFS ZDiTM ze statycznego feedu, bez kolei) oraz radom (GTFS MZDiK z mkuran.pl ze statycznego feedu, bez kolei).
# Klucze R2: {miasto}/manifest.json + {miasto}/db/kilometr-gtfs.db.gz (gzip).
# Brak legacy rootu (manifest.json, db/...) i wsparcia starych APK: pakiet
# zmienił id na app.kilometr, a stare buildy nie umiały czytać bazy .gz,
# więc świadomie nie mają ścieżki aktualizacji.
#
# Wymagane sekrety (repo → Settings → Secrets → Actions):
#   PDP_API_KEY            klucz https://pdp-api.plk-sa.pl (sekcje kolei
#                          z PDP: KD Wrocławia oraz IC/PR GZM; Kraków,
#                          Warszawa, Poznań, Trójmiasto i Łódź biorą koleje
#                          ze statycznych feedów, Szczecin, Kielce, Olsztyn, Białystok, Opole, Rzeszów, Lublin i Radom nie mają kolei)
#   CLOUDFLARE_API_TOKEN   token z uprawnieniem R2 write na bucket kilometr-timetable
#   CLOUDFLARE_ACCOUNT_ID  id konta Cloudflare
#   TIMETABLE_PUBLIC_URL   URL Workera, np. https://kilometr-timetable.<sub>.workers.dev
#                          (do pomijania buildów, gdy źródła bez zmian)
#
# Bez sekretów Cloudflare workflow kończy się na artefakcie Actions
# (do ręcznego podejrzenia) - R2 nie jest dotykane.

name: Timetable build → R2

on:
  schedule:
    # Codziennie 03:17 UTC - celowo nie o pełnej godzinie (mniejsze kolejki),
    # rozkłady zmieniają się co kilka dni, KD śledzimy przez /data-version.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      city:
        description: 'Miasto (puste = wszystkie)'
        required: false
        default: ''
        type: choice
        options: ['', wroclaw, krakow, gzm, warszawa, poznan, trojmiasto, lodz, szczecin, kielce, olsztyn, bialystok, opole, rzeszow, lublin, radom]

permissions:
  contents: read

concurrency:
  group: timetable-build
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build SQLite + upload R2 (${{ matrix.city }})
    runs-on: ubuntu-latest
    # Macierz liczona z inputu: puste (albo brak, np. cron) = oba miasta,
    # wybrane = tylko to jedno. `matrix` nie istnieje w warunku na poziomie
    # joba (job `if` jest liczone przed rozwinięciem strategii), więc
    # filtrujemy samą listę miast, a nie warunek.
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        city: ${{ (github.event_name == 'workflow_dispatch' && inputs.city != '') && fromJSON(format('["{0}"]', inputs.city)) || fromJSON('["wroclaw", "krakow", "gzm", "warszawa", "poznan", "trojmiasto", "lodz", "szczecin", "kielce", "olsztyn", "bialystok", "opole", "rzeszow", "lublin", "radom"]') }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (node:sqlite)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check unzip
        run: command -v unzip || (echo "::error::brak unzip na runnerze" && exit 1)

      - name: Data cache adresów
        id: address-cache-date
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Cache adresów OSM miasta
        uses: actions/cache@v5
        with:
          path: cloudflare/dist/address-cache/${{ matrix.city }}.json.gz
          key: addresses-v1-${{ matrix.city }}-${{ steps.address-cache-date.outputs.day }}
          restore-keys: addresses-v1-${{ matrix.city }}-

      - name: Build timetable.db + manifest (${{ matrix.city }})
        id: build
        run: |
          set +e
          node cloudflare/scripts/build-timetable.mjs --city=${{ matrix.city }} --write-coords
          code=$?
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then
            echo "### Bez zmian (skip) (${{ matrix.city }})" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$code"
        env:
          PDP_API_KEY: ${{ secrets.PDP_API_KEY }}
          TIMETABLE_PUBLIC_URL: ${{ secrets.TIMETABLE_PUBLIC_URL }}
          ADDRESS_OVERPASS_URL: ${{ vars.ADDRESS_OVERPASS_URL }}

      - name: Manifest → summary
        if: steps.build.outputs.exit == '0'
        run: |
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          node -e "const m=require('./cloudflare/dist/${{ matrix.city }}/manifest.json');console.log(JSON.stringify({city:m.city||'${{ matrix.city }}',version:m.version,builtAt:m.builtAt,gzMB:+(m.db.sizeBytes/1048576).toFixed(1),rawMB:+((m.db.uncompressedSizeBytes||0)/1048576).toFixed(1),stats:m.stats},null,2))" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Budżet rozmiaru: ostrzega, gdy baza urośnie wyraźnie względem R2.
      # Doradcze (nie blokuje uploadu): rozkład czasem rośnie legalnie,
      # ale +15% z dnia na dzień to zwykle błąd buildu, nie nowe kursy.
      - name: Budżet rozmiaru bazy
        if: steps.build.outputs.exit == '0'
        run: |
          set -euo pipefail
          NEW=$(stat -c%s "cloudflare/dist/${{ matrix.city }}/kilometr-gtfs.db.gz")
          RAW=$(stat -c%s "cloudflare/dist/${{ matrix.city }}/kilometr-gtfs.db")
          echo "Nowa baza gzip (${{ matrix.city }}): $((NEW / 1048576)) MB (nieskompresowana: $((RAW / 1048576)) MB)" >> "$GITHUB_STEP_SUMMARY"
          URL="${TIMETABLE_PUBLIC_URL:-}"
          if [ -z "$URL" ]; then
            echo "Brak TIMETABLE_PUBLIC_URL, pomijam porównanie." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          REMOTE=$(curl -fsS --max-time 20 "$URL/${{ matrix.city }}/manifest.json" 2>/dev/null || true)
          OLD=""
          if [ -n "$REMOTE" ]; then
            OLD=$(node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log((JSON.parse(s).db||{}).sizeBytes||0)}catch{console.log(0)}})" <<< "$REMOTE")
          fi
          if [ -z "${OLD:-}" ] || [ "$OLD" -le 0 ]; then
            echo "Brak zdalnego manifestu, pomijam porównanie." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          DIFF=$((NEW - OLD))
          PCT=$((DIFF * 100 / OLD))
          SIGN=""
          if [ "$DIFF" -ge 0 ]; then SIGN="+"; fi
          echo "R2: $((OLD / 1048576)) MB, nowa: $((NEW / 1048576)) MB (${SIGN}${PCT}%)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$PCT" -gt 15 ] && [ "$DIFF" -gt 5242880 ]; then
            echo "::warning::Baza (${{ matrix.city }}) urosła o ${PCT}% (+$((DIFF / 1048576)) MB) względem R2. Jeśli to nie nowy rozkład, sprawdź build."
          fi
        env:
          TIMETABLE_PUBLIC_URL: ${{ secrets.TIMETABLE_PUBLIC_URL }}

      - name: Artefakt (7 dni, do podejrzenia)
        if: steps.build.outputs.exit == '0'
        uses: actions/upload-artifact@v4
        with:
          name: kilometr-timetable-${{ matrix.city }}
          path: |
            cloudflare/dist/${{ matrix.city }}/kilometr-gtfs.db.gz
            cloudflare/dist/${{ matrix.city }}/kilometr-gtfs.db
            cloudflare/dist/${{ matrix.city }}/manifest.json
            cloudflare/data/kd-station-coords.json
            cloudflare/data/gzm-station-coords.json
          retention-days: 7

      # Snapshot adresów → R2: świeży przyspiesza kolejny build (nie uderza
      # już w Overpass), stary jest odgrzewem awaryjnym, gdy Overpass padnie
      # całkiem. Brak pliku = w tym runie nic nie wylądowało na dysku, więc
      # nie nadpisujemy tego, co leży w R2.
      - name: Snapshot adresów → R2
        if: steps.build.outputs.exit == '0' || steps.build.outputs.exit == '2'
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Brak sekretu CLOUDFLARE_API_TOKEN - pomijam upload snapshotu adresów do R2."
            exit 0
          fi
          FILE="cloudflare/dist/address-cache/${{ matrix.city }}.json.gz"
          if [ ! -f "$FILE" ]; then
            echo "Brak snapshotu adresów na dysku, zostawiam poprzedni w R2."
            exit 0
          fi
          npx -y wrangler@3.114.0 r2 object put "kilometr-timetable/${{ matrix.city }}/addresses.json.gz" \
            --file="$FILE" --content-type application/gzip
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Kolejność ma znaczenie. Telefon czyta manifest, potem dopiero ściąga
      # bazę. Manifest wrzucamy OSTATNI, bo to on jest sygnałem „baza jest
      # nowa” - w drugą stronę przez ~13 s uploadu 90 MB telefon widziałby nowy
      # manifest przy starej bazie, porównanie rozmiarów by nie przeszło i
      # odświeżanie kończyłoby się błędem zamiast nowym rozkładem.
      - name: Upload bazy → R2
        if: steps.build.outputs.exit == '0'
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Brak sekretu CLOUDFLARE_API_TOKEN - pomijam upload bazy do R2."
            exit 0
          fi
          npx -y wrangler@3.114.0 r2 object put "kilometr-timetable/${{ matrix.city }}/db/kilometr-gtfs.db.gz" \
            --file="cloudflare/dist/${{ matrix.city }}/kilometr-gtfs.db.gz" --content-type application/gzip
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload manifestu → R2 (sygnał dla telefonów)
        if: steps.build.outputs.exit == '0'
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Brak sekretu CLOUDFLARE_API_TOKEN - pomijam upload manifestu do R2."
            exit 0
          fi
          npx -y wrangler@3.114.0 r2 object put "kilometr-timetable/${{ matrix.city }}/manifest.json" \
            --file="cloudflare/dist/${{ matrix.city }}/manifest.json" --content-type application/json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
