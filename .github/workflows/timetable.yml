# Codzienny build prebuilt SQLite (MPK + KD) → Cloudflare R2.
#
# Wymagane sekrety (repo → Settings → Secrets → Actions):
#   PDP_API_KEY            klucz https://pdp-api.plk-sa.pl (tylko sekcja KD;
#                          bez niego build przechodzi jako MPK-only z warningiem)
#   CLOUDFLARE_API_TOKEN   token z uprawnieniem R2 write na bucket kilometr-timetable
#   CLOUDFLARE_ACCOUNT_ID  id konta Cloudflare
#   TIMETABLE_PUBLIC_URL   URL Workera, np. https://kilometr-timetable.<sub>.workers.dev
#                          (do pomijania buildów, gdy źródła bez zmian)
#
# Bez sekretów Cloudflare workflow kończy się na artefakcie Actions
# (do ręcznego podejrzenia) — R2 nie jest dotykane.

name: Timetable build → R2

on:
  schedule:
    # Codziennie 03:17 UTC — celowo nie o pełnej godzinie (mniejsze kolejki),
    # rozkłady MPK zmieniają się co kilka dni, KD śledzimy przez /data-version.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: timetable-build
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build SQLite + upload R2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (node:sqlite)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check unzip
        run: command -v unzip || (echo "::error::brak unzip na runnerze" && exit 1)

      - name: Build timetable.db + manifest
        id: build
        run: |
          set +e
          node cloudflare/scripts/build-timetable.mjs
          code=$?
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then
            echo "### Bez zmian — skip" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$code"
        env:
          PDP_API_KEY: ${{ secrets.PDP_API_KEY }}
          TIMETABLE_PUBLIC_URL: ${{ secrets.TIMETABLE_PUBLIC_URL }}

      - name: Manifest → summary
        if: steps.build.outputs.exit == '0'
        run: |
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          node -e "const m=require('./cloudflare/dist/manifest.json');console.log(JSON.stringify({version:m.version,builtAt:m.builtAt,sizeMB:+(m.db.sizeBytes/1048576).toFixed(1),stats:m.stats,sources:{mpk:m.sources.mpk.effectiveDate,kd:m.sources.kd.schedulesVersion||m.sources.kd.skippedReason}},null,2))" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Artefakt (7 dni, do podejrzenia)
        if: steps.build.outputs.exit == '0'
        uses: actions/upload-artifact@v6
        with:
          name: kilometr-timetable
          path: |
            cloudflare/dist/kilometr-gtfs.db
            cloudflare/dist/manifest.json
          retention-days: 7

      - name: Upload manifest → R2
        if: steps.build.outputs.exit == '0' && secrets.CLOUDFLARE_API_TOKEN != ''
        run: >
          npx -y wrangler@3 r2 object put kilometr-timetable/manifest.json
          --file=cloudflare/dist/manifest.json --content-type application/json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload bazy → R2
        if: steps.build.outputs.exit == '0' && secrets.CLOUDFLARE_API_TOKEN != ''
        run: >
          npx -y wrangler@3 r2 object put kilometr-timetable/db/kilometr-gtfs.db
          --file=cloudflare/dist/kilometr-gtfs.db --content-type application/x-sqlite3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
