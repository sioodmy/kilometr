name: Deploy Landing Page to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'landing/**'
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-pages:
    name: Build Landing Page
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: landing/package-lock.json

      - name: Build landing page (React → docs/)
        run: |
          set -euo pipefail
          npm --prefix landing ci
          npm --prefix landing run build

      # Landing (src/App.tsx) robi HEAD na ./app-release.apk i bez niego
      # przechodzi na fallback releases/latest/download/app-release.apk.
      # To tylko przyspiesza pierwsze wejście — brak pliku nie jest błędem.
      - name: Fetch latest APK from release (optional)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          if gh release download latest \
              -p 'app-release.apk' \
              -p 'app-release.apk.sha256' \
              -D docs/ > /dev/null 2>&1; then
            echo "Dodano APK z release 'latest' do artifactu Pages:"
            ls -lh docs/app-release.apk*
          else
            echo "::warning::Brak release 'latest' — landing użyje fallbacku na releases/latest/download/app-release.apk"
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
