name: Deploy Landing Page to GitHub Pages

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'landing/**'
      - 'src/i18n/**'
      - 'src/cities.ts'
      - 'src/sharing/**'
      - 'scripts/export-share-timetables.ts'
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-pages:
    name: Build Landing Page
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            landing/package-lock.json

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci
          npm --prefix landing ci

      - name: Export share timetables (best effort)
        continue-on-error: true
        run: npx tsx scripts/export-share-timetables.ts

      - name: Build landing page (React → docs/)
        env:
          ANDROID_APP_LINK_FINGERPRINTS: ${{ vars.ANDROID_APP_LINK_FINGERPRINTS }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: npm --prefix landing run build

      - name: Verify Pages output
        run: |
          set -euo pipefail
          test -f docs/index.html
          test -f docs/trip/index.html
          test -f docs/.well-known/assetlinks.json

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
