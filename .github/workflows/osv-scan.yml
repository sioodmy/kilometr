name: OSV-Scanner

# Skan CVE z bazy OSV.dev. PR łapie tylko NOWE podatności (stare tranzytywne
# z Expo nie czerwienią), harmonogram pilnuje całego drzewa co tydzień.
on:
  pull_request:
    branches:
      - dev
      - main
      - nightly
      - prod
  schedule:
    # Co poniedziałek nad ranem, poza CodeQL.
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan-pr:
    if: github.event_name == 'pull_request'
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.7.0"

  scan-scheduled:
    if: github.event_name != 'pull_request'
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.0"
