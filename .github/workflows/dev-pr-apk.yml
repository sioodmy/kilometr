name: Dev PR APK Preview (Self-hosted)

# Build odpalany RECZNIE komentarzem na PR dev -> main, nie na kazdym pushu.
# Komentarz musi brzmiec dokladnie: build machen !!!
# Dzieki temu runner (Azure VM) nie mieli sie przy kazdym synchronize.
on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner'
        required: true
        default: 'self-hosted'
        type: choice
        options:
          - 'self-hosted'
          - 'ubuntu-latest'
      pr_number:
        description: 'Numer PR do skomentowania'
        required: false
        default: '129'

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: 'dev-pr-apk-preview'
  cancel-in-progress: true

env:
  ANDROID_COMPILE_SDK: '36'
  ANDROID_BUILD_TOOLS: '36.0.0'
  ANDROID_NDK: '27.1.12297006'
  ANDROID_CMAKE: '3.30.5'

jobs:
  build-preview:
    name: Build Dev PR APK
    # Twarde zabezpieczenie runnera self-hosted przed kodem z zewnatrz:
    # 1. Wyzwalacz to komentarz na PR (nie push), o tresci dokladnie "build machen !!!"
    # 2. Komentujacy musi byc wlascicielem/czlonkiem/wspolpracownikiem repo
    # 3. Krok "Resolve and validate PR" sprawdza, ze PR idzie z glownego repo do main z galezi dev
    # 4. Dla recznego wywolania (workflow_dispatch) tylko wlasciciel repozytorium
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.body == 'build machen !!!' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner)
    runs-on: ${{ inputs.runner || 'self-hosted' }}

    steps:
      - name: Resolve and validate PR
        id: pr
        uses: actions/github-script@v7
        env:
          INPUT_PR: ${{ inputs.pr_number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const repoFull = `${context.repo.owner}/${context.repo.repo}`;
            let prNumber;
            if (context.eventName === 'issue_comment') {
              prNumber = context.payload.issue.number;
            } else {
              prNumber = Number(process.env.INPUT_PR || 129);
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            if (context.eventName === 'issue_comment') {
              if (pr.head.repo.full_name !== repoFull) {
                core.setFailed(`PR #${prNumber} pochodzi z forka (${pr.head.repo.full_name}); odmawiam budowy na self-hosted runnerze.`);
                return;
              }
              if (pr.base.ref !== 'main') {
                core.setFailed(`PR #${prNumber} nie celuje w main (base=${pr.base.ref}).`);
                return;
              }
              if (pr.head.ref !== 'dev') {
                core.setFailed(`PR #${prNumber} nie pochodzi z galezi dev (head=${pr.head.ref}).`);
                return;
              }
            }
            core.setOutput('number', String(prNumber));
            core.setOutput('head_sha', pr.head.sha);
            console.log(`PR #${prNumber}: ${pr.head.ref} -> ${pr.base.ref} @ ${pr.head.sha}`);

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha || github.ref }}
          fetch-depth: 0

      - name: Extract Git metadata
        id: git-meta
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          COMMIT_MSG="$(git log -1 --pretty=%s | tr '"' "'" | head -c 80)"
          VERSION="dev-$(date -u +%Y%m%d-%H%M)-${SHORT_SHA}"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "commit_msg=$COMMIT_MSG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Resolve Android SDK
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            if [ -d "$HOME/android-sdk" ]; then
              export ANDROID_HOME="$HOME/android-sdk"
            elif [ -d "$HOME/Android/Sdk" ]; then
              export ANDROID_HOME="$HOME/Android/Sdk"
            elif [ -d "/usr/lib/android-sdk" ]; then
              export ANDROID_HOME="/usr/lib/android-sdk"
            fi
          fi

          if [ -n "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
            if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
              echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
            fi
            if [ -d "$ANDROID_HOME/platform-tools" ]; then
              echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
            fi
          fi

      - name: Install Android SDK packages if missing
        run: |
          set -euo pipefail
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager \
              "platform-tools" \
              "platforms;android-${ANDROID_COMPILE_SDK}" \
              "build-tools;${ANDROID_BUILD_TOOLS}" \
              "ndk;${ANDROID_NDK}" \
              "cmake;${ANDROID_CMAKE}" || true
          fi

      - name: Install Node dependencies
        run: npm ci

      - name: Expo Prebuild
        env:
          APP_VERSION: ${{ steps.git-meta.outputs.version }}
        run: npx expo prebuild --platform android --clean --no-install

      - name: Tune Gradle
        run: |
          set -euo pipefail
          GP=android/gradle.properties
          printf '\n' >> "$GP"
          cat >> "$GP" <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
          org.gradle.caching=true
          EOF

      - name: Build Android Release APK (arm64-v8a)
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -x lint --no-daemon --console=plain --stacktrace -PreactNativeArchitectures=arm64-v8a

      - name: Prepare APK artifact
        run: |
          set -euo pipefail
          APK=$(ls -1 android/app/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1 || true)
          if [ -z "$APK" ]; then
            echo "::error::Nie znaleziono pliku APK w android/app/build/outputs/apk/release"
            exit 1
          fi
          mkdir -p apk-dist
          cp "$APK" apk-dist/kilometr-dev-arm64.apk
          (cd apk-dist && sha256sum kilometr-dev-arm64.apk > kilometr-dev-arm64.apk.sha256)
          ls -lh apk-dist

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kilometr-dev-arm64-apk
          path: apk-dist/*
          retention-days: 14

      - name: Comment on PR
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          SHORT_SHA: ${{ steps.git-meta.outputs.short_sha }}
          COMMIT_MSG: ${{ steps.git-meta.outputs.commit_msg }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_NAME: 'kilometr-dev-arm64-apk'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = process.env.PR_NUMBER ? Number(process.env.PR_NUMBER) : null;
            if (!prNumber) {
              console.log('Brak numeru PR, pomijam dodanie komentarza.');
              return;
            }

            const shortSha = process.env.SHORT_SHA || context.sha.substring(0, 7);
            const commitMsg = process.env.COMMIT_MSG || '';
            const runUrl = process.env.RUN_URL;
            const artifactName = process.env.ARTIFACT_NAME;
            const directDownload = `https://nightly.link/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/${artifactName}.zip`;

            const marker = '<!-- dev-preview-apk-comment -->';
            const body = [
              marker,
              '### 📱 Dev Preview APK gotowy do testow',
              '',
              `- **Commit:** [\`${shortSha}\`](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${shortSha}) ${commitMsg ? `(${commitMsg})` : ''}`,
              `- **Data:** ${new Date().toLocaleString('pl-PL', { timeZone: 'Europe/Warsaw' })}`,
              '- **Architektura:** `arm64-v8a`',
              '',
              '#### 📥 Pobierz APK',
              `- **[Bezposrednie pobranie (ZIP z APK)](${directDownload})** *(1 klikniecie przez nightly.link, bez logowania)*`,
              `- **[Szczegoly uruchomienia i artefakty](${runUrl})**`,
              '',
              '> Zainstaluj bezposrednio na telefonie z Androidem.'
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
              console.log(`Zaktualizowano istniejacy komentarz #${existing.id} w PR #${prNumber}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body,
              });
              console.log(`Dodano nowy komentarz w PR #${prNumber}`);
            }
