name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Architektura procesora (arm64-v8a to 99% nowoczesnych telefonów)'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - 'arm64-v8a'
          - 'all'
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'app/**'
      - 'assets/**'
      - 'modules/**'
      - 'plugins/**'
      - 'src/**'
      - 'app.json'
      - 'babel.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

concurrency:
  group: "build-apk"
  cancel-in-progress: false

env:
  # Wersje muszą być zgodne z node_modules/react-native/gradle/libs.versions.toml
  # (compileSdk/targetSdk=36, buildTools=36.0.0, ndkVersion=27.1.12297006)
  # oraz z CMAKE_VERSION używanym przez react-native (3.30.5).
  ANDROID_COMPILE_SDK: '36'
  ANDROID_BUILD_TOOLS: '36.0.0'
  ANDROID_NDK: '27.1.12297006'
  ANDROID_CMAKE: '3.30.5'

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    # Oszczędność minut: mergi Dependabota (same bumpki wersji w locku)
    # nie palą ~20 min builda — release poczeka na push z kodem albo ręczny
    # Run workflow. Ręczne odpalenie (workflow_dispatch) działa zawsze.
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'dependabot')
    # EXPO_PUBLIC_* jest wpieczone w bundla JS w trakcie assembleRelease,
    # więc URL musi być w env na runnerze. Ten sam sekret, którego używa
    # workflow timetable.yml — nic nowego nie trzeba dodawać w Settings.
    # Pusty sekret = aplikacja wraca na starą ścieżkę ZIP (fallback).
    env:
      EXPO_PUBLIC_TIMETABLE_URL: ${{ secrets.TIMETABLE_PUBLIC_URL }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      # Uwaga: NIE podawaj `packages` domyślnie. Domyślna wartość akcji to
      # "tools platform-tools", a pakiet `tools` został usunięty z repozytorium
      # Google — sdkmanager kończy się błędem "Failed to find package 'tools'".
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK platforms, build-tools, NDK and CMake
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}" \
            "cmake;${ANDROID_CMAKE}"

      - name: Install Node dependencies
        run: npm ci

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean --no-install

      - name: Tune Gradle for CI
        run: |
          set -euo pipefail
          GP=android/gradle.properties
          # Domyślne 2 GB JVM za mało dla równoległej kompilacji C++ (RN 0.86, new arch).
          # org.gradle.parallel=true już jest w pliku generowanym przez prebuild.
          #
          # UWAGA: `expo prebuild` generuje gradle.properties BEZ znaku nowej linii na
          # końcu, więc `cat >>` sklejałoby doklejaną właściwość z ostatnią istniejącą
          # ("expo.inlineModules.watchedDirectories=[]org.gradle.jvmargs=..."). Gradle
          # czyta wtedy tę wartość jako "[]org.gradle.jvmargs=..." i przekazuje ją do
          # `node ... mirror-kotlin-inline-modules --watched-directories-serialized`,
          # gdzie JSON.parse() pada → build wywala się na
          # "Process 'command 'node'' finished with non-zero exit value 1".
          printf '\n' >> "$GP"
          cat >> "$GP" <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
          org.gradle.caching=true
          EOF

      - name: Build Android Release APK
        run: |
          set -euo pipefail
          ARCH_FLAG=""
          TARGET_ARCH="${{ inputs.arch || 'arm64-v8a' }}"
          if [ "$TARGET_ARCH" = "arm64-v8a" ]; then
            echo "Szybki build: kompilacja tylko pod arm64-v8a"
            ARCH_FLAG="-PreactNativeArchitectures=arm64-v8a"
          else
            echo "Pełny build: wszystkie architektury"
          fi

          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -x lint --no-daemon --console=plain --stacktrace $ARCH_FLAG

      - name: Verify and stage APK
        run: |
          set -euo pipefail
          APK=$(ls -1 android/app/build/outputs/apk/release/*.apk | head -n 1)
          if [ -z "$APK" ]; then
            echo "Nie znaleziono żadnego APK w android/app/build/outputs/apk/release"
            exit 1
          fi
          echo "Zbudowano: $APK ($(du -h "$APK" | cut -f1))"
          mkdir -p apk-dist
          cp "$APK" apk-dist/app-release.apk
          (cd apk-dist && sha256sum app-release.apk > app-release.apk.sha256)

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kilometr-release-apk
          path: apk-dist/*

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Nazwa assetu (app-release.apk) jest kontraktem: przycisk „Pobierz APK"
          # w landingu bierze ./app-release.apk, a jako fallback linkuje
          # https://github.com/<repo>/releases/latest/download/app-release.apk
          # Uwaga: w --notes NIE używaj backticków — bash wykonałby ich
          # zawartość jako komendy i poszatkował notkę (stary bug).
          TAG=latest
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Kilometr ${{ github.sha }}" \
              --notes "Automatyczny build z gałęzi main ('${{ github.ref_name }}', commit '${{ github.sha }}')." \
              --target "${{ github.sha }}"
          fi
          gh release upload "$TAG" apk-dist/app-release.apk#app-release.apk --clobber
          gh release upload "$TAG" apk-dist/app-release.apk.sha256#app-release.apk.sha256 --clobber
          # Głośna weryfikacja: zielony run = release naprawdę istnieje.
          echo "--- Weryfikacja release '$TAG' ---"
          gh release view "$TAG" --json tagName,assets --jq '{tag: .tagName, assets: [.assets[] | .name]}'
          URL="https://github.com/${GH_REPO}/releases/download/${TAG}/app-release.apk"
          echo "APK do pobrania: $URL"
          echo "### APK opublikowane" >> "$GITHUB_STEP_SUMMARY"
          echo "[app-release.apk]($URL)" >> "$GITHUB_STEP_SUMMARY"
