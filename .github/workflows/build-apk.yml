name: Build Android APK & Deploy Pages

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Architektura procesora (arm64-v8a to 99% nowoczesnych telefonów)'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - 'arm64-v8a'
          - 'all'
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-and-build"
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platforms and build-tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0"

      - name: Install Node dependencies
        run: npm ci

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build Android Release APK
        run: |
          ARCH_FLAG=""
          TARGET_ARCH="${{ github.event.inputs.arch || 'arm64-v8a' }}"
          if [ "$TARGET_ARCH" = "arm64-v8a" ]; then
            echo "⚡ Szybki build: kompilacja tylko pod arm64-v8a"
            ARCH_FLAG="-PreactNativeArchitectures=arm64-v8a"
          else
            echo "🌍 Pełny build: wszystkie architektury"
          fi

          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -x lint --no-daemon --console=plain $ARCH_FLAG

      - name: Copy APK to docs for GitHub Pages hosting
        run: |
          cp android/app/build/outputs/apk/release/*.apk docs/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kilometr-release-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-apk
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
