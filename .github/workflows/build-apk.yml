name: Build & Release

# Unified Release DAG:
#   prepare (~20s) ──┬──► build-apk (~25m) ──┐
#                    ├──► build-aab (~25m) ──┼──► publish (~20s)
#                    └──► build-ipa (~22m) ──┘
#
# Kanały:
# - nightly (push / release): tylko APK + GitHub Release (prerelease).
# - prod (push / release): APK + Play AAB + niepodpisane iOS IPA budowane
#   równolegle i publikowane atomowo w jednym GitHub Release `vX.Y.Z`.
# - artifact-only (ręcznie): buduje wybrane cele z dowolnej gałęzi jako
#   artefakty Actions, bez tworzenia tagu ani GitHub Release.
on:
  push:
    branches:
      - nightly
      - prod
  workflow_dispatch:
    inputs:
      arch:
        description: 'Architektura Androida (auto = all na prod, arm64-v8a na nightly/test)'
        required: true
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'arm64-v8a'
          - 'all'
      mode:
        description: 'Tryb: release (publikuje wydanie nightly/prod) albo artifact-only (tylko artefakty)'
        required: true
        default: 'release'
        type: choice
        options:
          - 'release'
          - 'artifact-only'
      target:
        description: 'Platformy do zbudowania (auto = APK na nightly/test, APK + Play AAB + IPA na prod)'
        required: true
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'apk'
          - 'all'

permissions:
  contents: write
  actions: read

concurrency:
  group: "release-${{ github.ref_name }}"
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Release & Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      apk_name: ${{ steps.plan.outputs.apk_name }}
      arch: ${{ steps.plan.outputs.arch }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      publish: ${{ steps.plan.outputs.publish }}
      build_number: ${{ steps.plan.outputs.build_number }}
      signing_required: ${{ steps.plan.outputs.signing_required }}
      build_apk: ${{ steps.plan.outputs.build_apk }}
      build_aab: ${{ steps.plan.outputs.build_aab }}
      build_ipa: ${{ steps.plan.outputs.build_ipa }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js & install dependencies
        uses: ./.github/actions/setup-node-ci

      - name: Resolve release plan
        id: plan
        env:
          INPUT_ARCH: ${{ inputs.arch }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          CHANNEL="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_ARCH="${INPUT_ARCH:-auto}"
            MODE="${INPUT_MODE:-release}"
            TARGET="${INPUT_TARGET:-auto}"
          else
            RAW_ARCH="auto"
            MODE="release"
            TARGET="auto"
          fi

          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          BUILD_NUMBER="${GITHUB_RUN_ATTEMPT:-1}"
          PUBLISH="true"

          if [ "$MODE" = "artifact-only" ]; then
            CHANNEL="artifact-only"
            TAG="test-$(date -u +%Y%m%d-%H%M)-${SHORT_SHA}"
            APK_NAME="kilometr-test.apk"
            PRERELEASE="true"
            PUBLISH="false"
            if [ "$RAW_ARCH" = "auto" ]; then ARCH="arm64-v8a"; else ARCH="$RAW_ARCH"; fi
          else
            case "$CHANNEL" in
              nightly|prod) ;;
              *)
                echo "::error::Wydanie dozwolone tylko z gałęzi nightly lub prod (jest: $CHANNEL). Do builda testowego wybierz tryb artifact-only."
                exit 1
                ;;
            esac

            if [ "$CHANNEL" = "prod" ]; then
              TAG="$(node .github/scripts/next-version.mjs)"
              APK_NAME="kilometr-prod.apk"
              PRERELEASE="false"
              if [ "$RAW_ARCH" = "auto" ]; then ARCH="all"; else ARCH="$RAW_ARCH"; fi
            else
              TAG="nightly-$(date -u +%Y%m%d-%H%M)-${SHORT_SHA}"
              APK_NAME="kilometr-nightly.apk"
              PRERELEASE="true"
              if [ "$RAW_ARCH" = "auto" ]; then ARCH="arm64-v8a"; else ARCH="$RAW_ARCH"; fi
            fi
          fi

          BUILD_APK="true"
          BUILD_AAB="false"
          BUILD_IPA="false"
          if [ "$TARGET" = "all" ] || { [ "$TARGET" = "auto" ] && [ "$CHANNEL" = "prod" ]; }; then
            BUILD_AAB="true"
            BUILD_IPA="true"
          fi

          SIGNING_REQUIRED=""
          if [ "$CHANNEL" = "prod" ]; then
            SIGNING_REQUIRED="1"
          fi

          {
            echo "channel=$CHANNEL"
            echo "tag=$TAG"
            echo "version=$TAG"
            echo "apk_name=$APK_NAME"
            echo "arch=$ARCH"
            echo "prerelease=$PRERELEASE"
            echo "publish=$PUBLISH"
            echo "build_number=$BUILD_NUMBER"
            echo "signing_required=$SIGNING_REQUIRED"
            echo "build_apk=$BUILD_APK"
            echo "build_aab=$BUILD_AAB"
            echo "build_ipa=$BUILD_IPA"
          } >> "$GITHUB_OUTPUT"

          echo "Plan: channel=$CHANNEL tag=$TAG arch=$ARCH publish=$PUBLISH apk=$BUILD_APK aab=$BUILD_AAB ipa=$BUILD_IPA"

      # Fail-fast przed uruchomieniem kosztownych runnerów Android + macOS.
      - name: Verify signing secrets (prod / Play AAB)
        env:
          CHANNEL: ${{ steps.plan.outputs.channel }}
          BUILD_AAB: ${{ steps.plan.outputs.build_aab }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: |
          set -euo pipefail
          if [ "$CHANNEL" != "prod" ] && [ "$BUILD_AAB" != "true" ]; then
            exit 0
          fi
          MISSING=""
          for V in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS; do
            [ -n "${!V:-}" ] || MISSING="$MISSING $V"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Kanał prod / Play AAB wymaga sekretów podpisu (brak:$MISSING). Ustaw ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD i ANDROID_KEYSTORE_ALIAS."
            exit 1
          fi

      # Bramka KD: bez realnego KD w manifeście prod nie wypuszczamy wydania.
      - name: Verify timetable has real KD
        if: steps.plan.outputs.publish == 'true' || steps.plan.outputs.build_aab == 'true'
        env:
          TIMETABLE_URL: ${{ vars.TIMETABLE_URL }}
        run: node .github/scripts/verify-kd-manifest.mjs

      - name: Pre-build static gates
        run: |
          set -euo pipefail
          npm run typecheck
          npm run check:widget-strings
          npm run check:ios-strings
          npm run check:permission-gate
          node --test \
            scripts/check-android-version-code.test.mjs \
            .github/scripts/resolve-play-version.test.mjs

  build-apk:
    name: Build Android APK
    needs: prepare
    if: needs.prepare.outputs.build_apk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Android & Rust toolchain
        uses: ./.github/actions/setup-android-toolchain
        with:
          arch: ${{ needs.prepare.outputs.arch }}
          rust-cache-scope: apk

      - name: Test Rust RAPTOR engine
        run: cargo test --locked --manifest-path modules/kilometr-raptor/rust/Cargo.toml

      - name: Decode upload keystore from secrets
        id: keystore
        env:
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: |
          set -euo pipefail
          MISSING=""
          for V in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS; do
            [ -n "${!V:-}" ] || MISSING="$MISSING $V"
          done
          if [ -n "$MISSING" ]; then
            if [ "$CHANNEL" = "prod" ]; then
              echo "::error::Kanał prod wymaga sekretów podpisu (brak:$MISSING)."
              exit 1
            fi
            echo "::warning::Brak sekretów podpisu (brak:$MISSING). APK dostanie debug keystore."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-key.jks"
          echo "path=$RUNNER_TEMP/upload-key.jks" >> "$GITHUB_OUTPUT"
          echo "Klucz upload zdekodowany: $RUNNER_TEMP/upload-key.jks"

      - name: Expo Prebuild
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_SIGNING_REQUIRED: ${{ needs.prepare.outputs.signing_required }}
        run: npx expo prebuild --platform android --clean --no-install

      - name: Tune Gradle for CI
        run: |
          set -euo pipefail
          GP=android/gradle.properties
          # expo prebuild generuje gradle.properties bez końcowej nowej linii;
          # bez printf '\n' doklejka skleiłaby się z ostatnią właściwością.
          printf '\n' >> "$GP"
          cat >> "$GP" <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
          org.gradle.caching=true
          EOF

      - name: Build Android Release APK
        env:
          TARGET_ARCH: ${{ needs.prepare.outputs.arch }}
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEYSTORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ARCH_FLAG=""
          if [ "$TARGET_ARCH" = "arm64-v8a" ]; then
            echo "Szybki build: kompilacja tylko pod arm64-v8a"
            ARCH_FLAG="-PreactNativeArchitectures=arm64-v8a"
          else
            echo "Pełny build: wszystkie architektury"
          fi

          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -x lint --no-daemon --console=plain --stacktrace $ARCH_FLAG

      - name: Verify APK signing certificate
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1 || true)"
          if [ -z "$APK" ]; then
            echo "::error::Nie znaleziono APK do weryfikacji podpisu"
            exit 1
          fi
          APKSIGNER="${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          "$APKSIGNER" verify --print-certs "$APK"
          if [ -z "${KEYSTORE_PATH:-}" ]; then
            echo "::warning::Brak keystore release; APK podpisany debug keystore (kanał inny niż prod)."
            exit 0
          fi
          EXPECTED="$(keytool -exportcert -alias "$KEY_ALIAS" -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" | openssl dgst -sha256 | sed 's/^.*= //')"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          FORMATTED="$(printf '%s' "$ACTUAL" | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')"
          echo "Odcisk SHA-256 w APK:      $ACTUAL"
          echo "Odcisk SHA-256 w keystore: $EXPECTED"
          if [ "$(printf '%s' "$ACTUAL" | tr -d ':' | tr 'A-F' 'a-f')" != "$(printf '%s' "$EXPECTED" | tr -d ':' | tr 'A-F' 'a-f')" ]; then
            echo "::error::APK nie jest podpisany kluczem upload z sekretów ANDROID_KEYSTORE_*."
            exit 1
          fi
          {
            echo "Podpis APK zgodny z kluczem upload."
            echo "Odcisk certyfikatu do ANDROID_APP_LINK_FINGERPRINTS: \`$FORMATTED\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 'Gate: APK version, config, permissions & ABIs'
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          TARGET_ARCH: ${{ needs.prepare.outputs.arch }}
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1 || true)"
          if [ -z "$APK" ]; then
            echo "::error::Nie znaleziono APK do weryfikacji"
            exit 1
          fi
          AAPT="${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/aapt"
          BADGING="$("$AAPT" dump badging "$APK")"
          APK_VERSION="$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p")"
          APK_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p")"
          EXPECTED_CODE="$(APP_VERSION="$TAG" BUILD_NUMBER="$BUILD_NUMBER" node -e "process.stdout.write(String(require('./app.config.js')({}).android.versionCode))")"
          echo "APK versionName=$APK_VERSION (tag=$TAG), versionCode=$APK_CODE (oczekiwany=$EXPECTED_CODE)"
          if [ "$APK_VERSION" != "$TAG" ]; then
            echo "::error::Wersja APK ($APK_VERSION) nie zgadza się z tagiem release ($TAG)"
            exit 1
          fi
          if [ "$APK_CODE" != "$EXPECTED_CODE" ]; then
            echo "::error::versionCode APK ($APK_CODE) nie zgadza się z oczekiwanym ($EXPECTED_CODE)"
            exit 1
          fi

          "$AAPT" dump permissions "$APK" > "$RUNNER_TEMP/apk-permissions.txt"
          npm run check:android-permissions -- "$RUNNER_TEMP/apk-permissions.txt"

          python3 - "$APK" <<'PY'
          import json
          import os
          import sys
          import zipfile

          apk_path = sys.argv[1]
          with zipfile.ZipFile(apk_path) as apk:
              embedded = json.loads(apk.read('assets/app.config'))
              assert embedded['version'] == os.environ['TAG'], (
                  f"Nieprawidłowa wersja w assets/app.config: {embedded.get('version')} != {os.environ['TAG']}"
              )
              abis = {
                  path.split('/')[1]
                  for path in apk.namelist()
                  if path.startswith('lib/') and path.endswith('/libkilometr_raptor.so')
              }
          expected = {'arm64-v8a'} if os.environ['TARGET_ARCH'] == 'arm64-v8a' else {'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'}
          assert abis == expected, f'Niepełne architektury silnika RAPTOR w APK: {abis}, oczekiwano {expected}'
          print(f'APK OK: versionName={os.environ["TAG"]}, arch={sorted(abis)}')
          PY

      - name: Stage APK
        env:
          APK_NAME: ${{ needs.prepare.outputs.apk_name }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1 || true)"
          echo "Zbudowano: $APK ($(du -h "$APK" | cut -f1))"
          mkdir -p apk-dist
          cp "$APK" "apk-dist/$APK_NAME"
          (cd apk-dist && sha256sum "$APK_NAME" > "$APK_NAME.sha256")

          # Kontrakt landingu: przycisk pobiera app-release.apk z wydania latest.
          if [ "$CHANNEL" = "prod" ]; then
            cp "apk-dist/$APK_NAME" "apk-dist/app-release.apk"
            (cd apk-dist && sha256sum app-release.apk > app-release.apk.sha256)
          fi

          ls -lh apk-dist

      - name: Check APK size budget
        env:
          APK_NAME: ${{ needs.prepare.outputs.apk_name }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = "artifact-only" ]; then exit 0; fi
          SIZE=$(stat -c%s "apk-dist/$APK_NAME")
          echo "APK: $((SIZE / 1048576)) MB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$CHANNEL" = "prod" ]; then
            MODE="stable"
            ASSET="kilometr-prod.apk"
          else
            MODE="nightly"
            ASSET="kilometr-nightly.apk"
          fi
          LIST=$(gh release list --limit 30 --json tagName,isPrerelease 2>/dev/null || true)
          PREV=""
          if [ -n "$LIST" ]; then
            PREV=$(MODE="$MODE" node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const all=JSON.parse(s);const r=process.env.MODE==='stable'?all.find(x=>!x.isPrerelease&&/^v\d+\.\d+\.\d+$/.test(x.tagName)):all.map(x=>x.tagName).find(t=>t.startsWith('nightly-'));console.log(typeof r==='string'?r:(r?r.tagName:''))}catch{console.log('')}})" <<< "$LIST")
          fi
          if [ -z "${PREV:-}" ]; then
            echo "Brak poprzedniego wydania $CHANNEL, pomijam porównanie." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          VIEW=$(gh release view "$PREV" --json assets 2>/dev/null || true)
          PREVSIZE=""
          if [ -n "$VIEW" ]; then
            PREVSIZE=$(ASSET="$ASSET" node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const a=(JSON.parse(s).assets||[]).find(x=>x.name===process.env.ASSET);console.log(a?a.size:0)}catch{console.log(0)}})" <<< "$VIEW")
          fi
          if { [ -z "${PREVSIZE:-}" ] || [ "$PREVSIZE" -le 0 ]; } && [ "$MODE" = "stable" ]; then
            ASSET="app-release.apk"
            if [ -n "$VIEW" ]; then
              PREVSIZE=$(ASSET="$ASSET" node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const a=(JSON.parse(s).assets||[]).find(x=>x.name===process.env.ASSET);console.log(a?a.size:0)}catch{console.log(0)}})" <<< "$VIEW")
            fi
          fi
          if [ -z "${PREVSIZE:-}" ] || [ "$PREVSIZE" -le 0 ]; then
            echo "Wydanie $PREV nie ma assetu $ASSET, pomijam." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          DIFF=$((SIZE - PREVSIZE))
          PCT=$((DIFF * 100 / PREVSIZE))
          SIGN=""
          if [ "$DIFF" -ge 0 ]; then SIGN="+"; fi
          echo "$PREV: $((PREVSIZE / 1048576)) MB, ten build: $((SIZE / 1048576)) MB (${SIGN}${PCT}%)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$PCT" -gt 10 ] && [ "$DIFF" -gt 1048576 ]; then
            echo "::warning::APK urosło o ${PCT}% (+$((DIFF / 1048576)) MB) względem $PREV. Jeśli to nie nowe zasoby, sprawdź build."
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kilometr-${{ needs.prepare.outputs.channel }}-apk
          path: apk-dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Summarize artifact-only build
        if: needs.prepare.outputs.publish != 'true'
        env:
          APK_NAME: ${{ needs.prepare.outputs.apk_name }}
        run: |
          set -euo pipefail
          {
            echo "### APK testowy (bez wydania)"
            echo ""
            echo "Pobierz z sekcji Artifacts: \`kilometr-${{ needs.prepare.outputs.channel }}-apk\` (\`$APK_NAME\`)."
            echo "Wersja w APK: \`${{ needs.prepare.outputs.version }}\`."
          } >> "$GITHUB_STEP_SUMMARY"

  build-aab:
    name: Build Play AAB
    needs: prepare
    if: needs.prepare.outputs.build_aab == 'true'
    # Wywoływany workflow nie może podnieść uprawnień ponad job wywołujący;
    # bez tego wpisu dostaje domyślne read i publikacja AAB pada jeszcze
    # przed startem pierwszym krokiem.
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/build-aab.yml
    with:
      arch: ${{ needs.prepare.outputs.arch }}
      release_tag: ${{ needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.tag || '' }}
      checkout_ref: ${{ github.sha }}
      caller_workflow: build-apk.yml
      skip_prechecks: true
      skip_publish: true
    secrets: inherit

  build-ipa:
    name: Build iOS IPA
    needs: prepare
    if: needs.prepare.outputs.build_ipa == 'true'
    uses: ./.github/workflows/build-ipa.yml
    with:
      release_tag: ${{ needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.tag || '' }}
      artifact_only: ${{ needs.prepare.outputs.publish != 'true' }}
      skip_publish: true
    secrets: inherit

  publish:
    name: Publish GitHub Release
    needs: [prepare, build-apk, build-aab, build-ipa]
    # Jeśli APK przeszedł na prod, publikujemy wydanie nawet gdy iOS padnie
    # (kontrakt README: błąd kompilacji iOS pozostawia dostępne APK).
    if: always() && needs.prepare.outputs.publish == 'true' && needs.build-apk.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repo for release notes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: kilometr-${{ needs.prepare.outputs.channel }}-apk
          path: release-dist/apk

      - name: Download Play AAB artifact
        if: needs.build-aab.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: kilometr-play-aab
          path: release-dist/aab

      - name: Download iOS IPA artifact
        if: needs.build-ipa.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: kilometr-ios-unsigned
          path: release-dist/ipa

      - name: Generate Release Notes & Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          APK_NAME: ${{ needs.prepare.outputs.apk_name }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          AAB_RESULT: ${{ needs.build-aab.result }}
          IPA_RESULT: ${{ needs.build-ipa.result }}
        run: |
          set -euo pipefail
          node .github/scripts/generate-release-notes.mjs \
            --tag "$TAG" \
            --channel "$CHANNEL" \
            --apk-name "$APK_NAME" \
            --output "release-dist/release-notes.md" \
            --sha-file "release-dist/apk/${APK_NAME}.sha256"

          if [ "$CHANNEL" = "prod" ]; then
            TITLE="Kilometr $TAG"
          else
            TITLE="Kilometr nightly $TAG"
          fi

          PRERELEASE_FLAG=""
          if [ "$PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          ASSETS=(
            "release-dist/apk/${APK_NAME}#${APK_NAME}"
            "release-dist/apk/${APK_NAME}.sha256#${APK_NAME}.sha256"
          )

          if [ "$CHANNEL" = "prod" ]; then
            ASSETS+=(
              "release-dist/apk/app-release.apk#app-release.apk"
              "release-dist/apk/app-release.apk.sha256#app-release.apk.sha256"
            )
          fi

          if [ "$AAB_RESULT" = "success" ] && [ -f "release-dist/aab/app-release.aab" ]; then
            cp "release-dist/aab/app-release.aab" "release-dist/aab/kilometr-prod.aab"
            (cd release-dist/aab && sha256sum kilometr-prod.aab > kilometr-prod.aab.sha256)
            ASSETS+=(
              "release-dist/aab/kilometr-prod.aab#kilometr-prod.aab"
              "release-dist/aab/kilometr-prod.aab.sha256#kilometr-prod.aab.sha256"
            )
          fi

          if [ "$IPA_RESULT" = "success" ] && [ -f "release-dist/ipa/kilometr-unsigned.ipa" ]; then
            ASSETS+=(
              "release-dist/ipa/kilometr-unsigned.ipa#kilometr-unsigned.ipa"
              "release-dist/ipa/kilometr-unsigned.ipa.sha256#kilometr-unsigned.ipa.sha256"
            )
          fi

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG już istnieje, aktualizacja assetów i notek"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file release-dist/release-notes.md
          else
            echo "Tworzenie nowego GitHub Release: $TAG"
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes-file release-dist/release-notes.md \
              --target "${{ github.sha }}" \
              $PRERELEASE_FLAG \
              "${ASSETS[@]}"
          fi

          echo "Weryfikacja release '$TAG':"
          gh release view "$TAG" --json tagName,isPrerelease,assets \
            --jq '{tag: .tagName, prerelease: .isPrerelease, assets: [.assets[] | .name]}'

          {
            echo "### Release \`$TAG\` ($CHANNEL)"
            echo ""
            echo "| Artifact | Status |"
            echo "| --- | --- |"
            echo "| Android APK (\`$APK_NAME\`) | \`${{ needs.build-apk.result }}\` |"
            echo "| Google Play AAB | \`$AAB_RESULT\` |"
            echo "| iOS Unsigned IPA | \`$IPA_RESULT\` |"
            echo ""
            echo "[Pobierz $APK_NAME](https://github.com/${GH_REPO}/releases/download/${TAG}/${APK_NAME})"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$AAB_RESULT" = "failure" ] || [ "$AAB_RESULT" = "cancelled" ]; then
            echo "::error::Publikacja APK powiodła się, ale build Play AAB zakończył się statusem: $AAB_RESULT."
            exit 1
          fi
          if [ "$IPA_RESULT" = "failure" ] || [ "$IPA_RESULT" = "cancelled" ]; then
            echo "::error::Publikacja Androida powiodła się, ale build iOS IPA zakończył się statusem: $IPA_RESULT."
            exit 1
          fi
