name: Build & Release APK

# Build APK uruchamia się WYŁĄCZNIE przy pushu do kanałów nightly/prod.
# `main` i `dev` nie budują APK, promocja kodu robi się PR-ami, a build
# startuje dopiero na wyraźnym kanale wydawniczym.
#
# Ręczne uruchomienie (workflow_dispatch) ma dwa tryby:
#
# - `release` (domyślny): jak push. Kanał wynika z gałęzi (nightly/prod),
#   więc nie da się zbudować „prod" z nieaudytowanego brancha. Publikuje
#   GitHub Release z APK jako assetem.
# - `artifact-only`: buduje APK z DOWOLNEJ gałęzi i tylko dołącza go jako
#   artefakt Actions. Nic nie publikuje, żadnego release ani tagu. Do tego
#   służy, żeby pobrać APK do testów na urządzeniu bez zaśmiecania wydań.
on:
  push:
    branches:
      - nightly
      - prod
  workflow_dispatch:
    inputs:
      arch:
        description: 'Architektura procesora (arm64-v8a to 99% nowoczesnych telefonów)'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - 'arm64-v8a'
          - 'all'
      mode:
        description: 'Tryb: release (jak push, publikuje wydanie) albo artifact-only (tylko APK do pobrania)'
        required: true
        default: 'release'
        type: choice
        options:
          - 'release'
          - 'artifact-only'

permissions:
  contents: write

concurrency:
  group: "build-apk-${{ github.ref_name }}"
  cancel-in-progress: false

env:
  # Wersje muszą być zgodne z node_modules/react-native/gradle/libs.versions.toml
  # (compileSdk/targetSdk=36, buildTools=36.0.0, ndkVersion=27.1.12297006)
  # oraz z CMAKE_VERSION używanym przez react-native (3.30.5).
  ANDROID_COMPILE_SDK: '36'
  ANDROID_BUILD_TOOLS: '36.0.0'
  ANDROID_NDK: '27.1.12297006'
  ANDROID_CMAKE: '3.30.5'

jobs:
  build-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest
    # URL rozkładu jest wpieczony w kodzie (src/services/gtfsConfig.ts,
    # data.kilometr.app), więc build nie potrzebuje żadnego sekretu.
    # Nadpisanie lokalnie: EXPO_PUBLIC_TIMETABLE_URL w .env.

    steps:
      # Pełna historia + tagi: potrzebne do auto-semver i notek z conventional
      # commitów (zakres od ostatniego tagu danej gałęzi).
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Bramka: APK pobiera bazę z R2 przy starcie, więc nie wypuszczamy
      # wydania wskazującego na serwer bez realnego KD (MPK-only/atrapa).
      # Manifest niedostępny = ostrzeżenie (R2 może leżeć); manifest
      # osiągalny bez KD = twardy błąd.
      - name: Verify timetable has real KD
        env:
          # Opcjonalne nadpisanie hosta rozkładu (repository variable), domyślnie produkcja.
          TIMETABLE_URL: ${{ vars.TIMETABLE_URL }}
        run: |
          set -euo pipefail
          URL="${TIMETABLE_URL:-https://data.kilometr.app}/manifest.json"
          if ! curl -fsS --max-time 20 "$URL" -o /tmp/timetable-manifest.json; then
            echo "::warning::Nie mogę pobrać manifestu rozkładu ($URL). Pomijam weryfikację KD."
            exit 0
          fi
          node -e '
            const m = require("/tmp/timetable-manifest.json");
            const kd = (m.sources && m.sources.kd) || {};
            const stations = Number(kd.stations || 0);
            const trips = Number(kd.trips || 0);
            if (kd.skippedReason || stations <= 0 || trips <= 0) {
              console.error("::error::Manifest bez realnego KD (skippedReason=" + (kd.skippedReason || "null") + ", stations=" + stations + ", trips=" + trips + "). Nie buduję APK na bazie bez KD.");
              process.exit(1);
            }
            console.log("KD OK: stations=" + stations + ", routes=" + (kd.routes || 0) + ", trips=" + trips + ", interchanges=" + (kd.interchanges || 0));
          '

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      # Uwaga: NIE podawaj `packages` domyślnie. Domyślna wartość akcji to
      # "tools platform-tools", a pakiet `tools` został usunięty z repozytorium
      # Google, sdkmanager kończy się błędem "Failed to find package 'tools'".
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK platforms, build-tools, NDK and CMake
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}" \
            "cmake;${ANDROID_CMAKE}"

      # Kanał decyduje o tagu, nazwie assetu, architekturze i fladze prerelease.
      # prod: nowa wersja semver z conventional commitów, nie-prerelease (ląduje
      # jako GitHub "latest"). nightly: unikalny tag z datą i SHA, prerelease.
      # artifact-only (tylko ręcznie): z dowolnej gałęzi, bez wydania i tagu.
      - name: Resolve channel, tag, version and asset name
        id: release
        env:
          INPUT_ARCH: ${{ inputs.arch }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          # Kanał ZAWSZE z gałęzi. Nawet przy workflow_dispatch, dzięki temu
          # nie da się odpalić builda „prod" z dev/feature brancha.
          CHANNEL="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARCH="${INPUT_ARCH:-}"
            MODE="${INPUT_MODE:-release}"
          else
            ARCH=""
            MODE="release"
          fi

          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          PUBLISH="true"

          # Numer podejścia runu (re-run tego samego workflow) trafia jako slot
          # kompilacji do versionCode prod: v1.0.0 + podejście 2 -> 1000002.
          BUILD_NUMBER="${GITHUB_RUN_ATTEMPT:-1}"

          if [ "$MODE" = "artifact-only" ]; then
            # Buduje z dowolnej gałęzi i tylko dołącza APK jako artefakt.
            # Żadnego tagu ani wydania, więc nie wolno zależeć od channela.
            CHANNEL="artifact-only"
            TAG="test-$(date -u +%Y%m%d-%H%M)-${SHORT_SHA}"
            APK_NAME="kilometr-test.apk"
            PRERELEASE="true"
            PUBLISH="false"
            [ -n "$ARCH" ] || ARCH="arm64-v8a"
          else
            case "$CHANNEL" in
              nightly|prod) ;;
              *) echo "::error::Build APK dozwolony tylko z gałęzi nightly lub prod (jest: $CHANNEL). Do builda testowego wybierz tryb artifact-only."; exit 1 ;;
            esac

            if [ "$CHANNEL" = "prod" ]; then
              TAG="$(node .github/scripts/next-version.mjs)"
              APK_NAME="kilometr-prod.apk"
              PRERELEASE="false"
              [ -n "$ARCH" ] || ARCH="all"
            else
              TAG="nightly-$(date -u +%Y%m%d-%H%M)-${SHORT_SHA}"
              APK_NAME="kilometr-nightly.apk"
              PRERELEASE="true"
              [ -n "$ARCH" ] || ARCH="arm64-v8a"
            fi
          fi

          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "arch=$ARCH" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Resolved: channel=$CHANNEL tag=$TAG apk=$APK_NAME arch=$ARCH prerelease=$PRERELEASE publish=$PUBLISH build=$BUILD_NUMBER"

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Rust toolchain and Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ steps.release.outputs.arch == 'arm64-v8a' && 'aarch64-linux-android' || 'aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android' }}

      - name: Cache Rust RAPTOR target
        uses: actions/cache@v4
        with:
          path: modules/kilometr-raptor/rust/target
          key: rust-raptor-${{ runner.os }}-${{ steps.release.outputs.arch }}-${{ hashFiles('modules/kilometr-raptor/rust/Cargo.toml', 'modules/kilometr-raptor/rust/src/**') }}
          restore-keys: |
            rust-raptor-${{ runner.os }}-${{ steps.release.outputs.arch }}-
            rust-raptor-${{ runner.os }}-

      - name: Test Rust RAPTOR engine
        run: cargo test --manifest-path modules/kilometr-raptor/rust/Cargo.toml

      - name: Expo Prebuild
        env:
          # Wersja w metadanych APK (versionName/versionCode) zależy od tagu
          # release'u; app.config.js czyta APP_VERSION. BUILD_NUMBER zajmuje
          # dwie ostatnie cyfry versionCode (numer podejścia runu).
          APP_VERSION: ${{ steps.release.outputs.version }}
          BUILD_NUMBER: ${{ steps.release.outputs.build_number }}
        run: npx expo prebuild --platform android --clean --no-install

      - name: Tune Gradle for CI
        run: |
          set -euo pipefail
          GP=android/gradle.properties
          # Domyślne 2 GB JVM za mało dla równoległej kompilacji C++ (RN 0.86, new arch).
          # org.gradle.parallel=true już jest w pliku generowanym przez prebuild.
          #
          # UWAGA: `expo prebuild` generuje gradle.properties BEZ znaku nowej linii na
          # końcu, więc `cat >>` sklejałoby doklejaną właściwość z ostatnią istniejącą
          # ("expo.inlineModules.watchedDirectories=[]org.gradle.jvmargs=..."). Gradle
          # czyta wtedy tę wartość jako "[]org.gradle.jvmargs=..." i przekazuje ją do
          # `node ... mirror-kotlin-inline-modules --watched-directories-serialized`,
          # gdzie JSON.parse() pada → build wywala się na
          # "Process 'command 'node'' finished with non-zero exit value 1".
          printf '\n' >> "$GP"
          cat >> "$GP" <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
          org.gradle.caching=true
          EOF

      - name: Build Android Release APK
        env:
          TARGET_ARCH: ${{ steps.release.outputs.arch }}
          # Gradle regeneruje assets/app.config przy każdym buildzie i bez
          # APP_VERSION wpisuje tam wersję z app.json. Constants.expoConfig.version
          # musi zgadzać się z tagiem, bo runtime czyta z niego wersję.
          APP_VERSION: ${{ steps.release.outputs.version }}
          BUILD_NUMBER: ${{ steps.release.outputs.build_number }}
        run: |
          set -euo pipefail
          ARCH_FLAG=""
          if [ "$TARGET_ARCH" = "arm64-v8a" ]; then
            echo "Szybki build: kompilacja tylko pod arm64-v8a"
            ARCH_FLAG="-PreactNativeArchitectures=arm64-v8a"
          else
            echo "Pełny build: wszystkie architektury"
          fi

          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -x lint --no-daemon --console=plain --stacktrace $ARCH_FLAG

      - name: Verify APK version matches release tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
          BUILD_NUMBER: ${{ steps.release.outputs.build_number }}
        run: |
          set -euo pipefail
          APK=$(ls -1 android/app/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1 || true)
          AAPT="${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/aapt"
          BADGING="$("$AAPT" dump badging "$APK")"
          APK_VERSION="$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p")"
          APK_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p")"
          EXPECTED_CODE="$(APP_VERSION="$TAG" BUILD_NUMBER="$BUILD_NUMBER" node -e "process.stdout.write(String(require('./app.config.js')({}).android.versionCode))")"
          echo "APK versionName=$APK_VERSION (tag=$TAG), versionCode=$APK_CODE (oczekiwany=$EXPECTED_CODE)"
          if [ "$APK_VERSION" != "$TAG" ]; then
            echo "::error::Wersja APK ($APK_VERSION) nie zgadza się z tagiem release ($TAG)"
            exit 1
          fi
          if [ "$APK_CODE" != "$EXPECTED_CODE" ]; then
            echo "::error::versionCode APK ($APK_CODE) nie zgadza się z oczekiwanym ($EXPECTED_CODE)"
            exit 1
          fi
          # app.config jest wersją widzianą przez Constants.expoConfig w runtime
          # i to z niej kod rozpoznaje kanał builda.
          EMBEDDED_VERSION="$(unzip -p "$APK" assets/app.config | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).version||'')}catch{}})")"
          echo "app.config version=$EMBEDDED_VERSION (tag=$TAG)"
          if [ "$EMBEDDED_VERSION" != "$TAG" ]; then
            echo "::error::Wersja w assets/app.config ($EMBEDDED_VERSION) nie zgadza się z tagiem ($TAG); Constants.expoConfig.version byłby błędny w runtime"
            exit 1
          fi

      - name: 'Gate: tylko potrzebne uprawnienia Androida'
        run: |
          set -euo pipefail
          APK=$(ls -1 android/app/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::Nie znaleziono APK do kontroli uprawnień"
            exit 1
          fi
          AAPT="${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/aapt"
          "$AAPT" dump permissions "$APK" > "$RUNNER_TEMP/apk-permissions.txt"
          npm run check:android-permissions -- "$RUNNER_TEMP/apk-permissions.txt"

      - name: Verify and stage APK
        env:
          APK_NAME: ${{ steps.release.outputs.apk_name }}
          CHANNEL: ${{ steps.release.outputs.channel }}
        run: |
          set -euo pipefail
          APK=$(ls -1 android/app/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1 || true)
          if [ -z "$APK" ]; then
            echo "Nie znaleziono żadnego APK w android/app/build/outputs/apk/release"
            exit 1
          fi
          echo "Zbudowano: $APK ($(du -h "$APK" | cut -f1))"
          mkdir -p apk-dist
          cp "$APK" "apk-dist/$APK_NAME"
          (cd apk-dist && sha256sum "$APK_NAME" > "$APK_NAME.sha256")

          # Kontrakt landingu: przycisk bierze app-release.apk z release "latest".
          # Prod wystawia więc dodatkowo alias o tej nazwie, żeby landing działał
          # zanim podłączymy dwie osobne opcje pobierania (nightly/prod).
          if [ "$CHANNEL" = "prod" ]; then
            cp "apk-dist/$APK_NAME" "apk-dist/app-release.apk"
            (cd apk-dist && sha256sum app-release.apk > app-release.apk.sha256)
          fi

          ls -lh apk-dist

      # Budżet rozmiaru: ostrzega, gdy APK urośnie wyraźnie względem
      # poprzedniego wydania tego kanału. Doradcze, nie blokuje publikacji.
      - name: Budżet rozmiaru APK
        env:
          APK_NAME: ${{ steps.release.outputs.apk_name }}
          CHANNEL: ${{ steps.release.outputs.channel }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = "artifact-only" ]; then exit 0; fi
          SIZE=$(stat -c%s "apk-dist/$APK_NAME")
          echo "APK: $((SIZE / 1048576)) MB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$CHANNEL" = "prod" ]; then
            MODE="stable"
            ASSET="kilometr-prod.apk"
          else
            MODE="nightly"
            ASSET="kilometr-nightly.apk"
          fi
          LIST=$(gh release list --limit 30 --json tagName,isPrerelease 2>/dev/null || true)
          PREV=""
          if [ -n "$LIST" ]; then
            PREV=$(MODE="$MODE" node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const all=JSON.parse(s);const r=process.env.MODE==='stable'?all.find(x=>!x.isPrerelease&&/^v\d+\.\d+\.\d+$/.test(x.tagName)):all.map(x=>x.tagName).find(t=>t.startsWith('nightly-'));console.log(typeof r==='string'?r:(r?r.tagName:''))}catch{console.log('')}})" <<< "$LIST")
          fi
          if [ -z "${PREV:-}" ]; then
            echo "Brak poprzedniego wydania $CHANNEL, pomijam porównanie." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          VIEW=$(gh release view "$PREV" --json assets 2>/dev/null || true)
          PREVSIZE=""
          if [ -n "$VIEW" ]; then
            PREVSIZE=$(ASSET="$ASSET" node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const a=(JSON.parse(s).assets||[]).find(x=>x.name===process.env.ASSET);console.log(a?a.size:0)}catch{console.log(0)}})" <<< "$VIEW")
          fi
          # Starsze wydania prod nie mają kilometr-prod.apk, tylko alias
          # app-release.apk (ta sama zawartość, inna nazwa).
          if { [ -z "${PREVSIZE:-}" ] || [ "$PREVSIZE" -le 0 ]; } && [ "$MODE" = "stable" ]; then
            ASSET="app-release.apk"
            if [ -n "$VIEW" ]; then
              PREVSIZE=$(ASSET="$ASSET" node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const a=(JSON.parse(s).assets||[]).find(x=>x.name===process.env.ASSET);console.log(a?a.size:0)}catch{console.log(0)}})" <<< "$VIEW")
            fi
          fi
          if [ -z "${PREVSIZE:-}" ] || [ "$PREVSIZE" -le 0 ]; then
            echo "Wydanie $PREV nie ma assetu $ASSET, pomijam." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          DIFF=$((SIZE - PREVSIZE))
          PCT=$((DIFF * 100 / PREVSIZE))
          SIGN=""
          if [ "$DIFF" -ge 0 ]; then SIGN="+"; fi
          echo "$PREV: $((PREVSIZE / 1048576)) MB, ten build: $((SIZE / 1048576)) MB (${SIGN}${PCT}%)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$PCT" -gt 10 ] && [ "$DIFF" -gt 1048576 ]; then
            echo "::warning::APK urosło o ${PCT}% (+$((DIFF / 1048576)) MB) względem $PREV. Jeśli to nie nowe zasoby, sprawdź build."
          fi

      # Notki i wydanie tylko w trybie release. artifact-only kończy na
      # artefakcie Actions i nie tworzy tagu ani wydania.
      - name: Generate Release Notes from Conventional Commits
        if: steps.release.outputs.publish == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          CHANNEL: ${{ steps.release.outputs.channel }}
          APK_NAME: ${{ steps.release.outputs.apk_name }}
        run: |
          set -euo pipefail
          node .github/scripts/generate-release-notes.mjs \
            --tag "$TAG" \
            --channel "$CHANNEL" \
            --apk-name "$APK_NAME" \
            --output "apk-dist/release-notes.md" \
            --sha-file "apk-dist/${APK_NAME}.sha256"
          echo "Wygenerowane Release Notes:"
          cat apk-dist/release-notes.md

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kilometr-${{ steps.release.outputs.channel }}-apk
          path: apk-dist/*

      # W trybie artifact-only nie ma wydania, więc podpowiadamy w podsumowaniu
      # runu, gdzie zabrać APK (Actions → ten run → Artifacts).
      - name: Summarize artifact-only build
        if: steps.release.outputs.publish != 'true'
        env:
          APK_NAME: ${{ steps.release.outputs.apk_name }}
        run: |
          set -euo pipefail
          echo "### APK testowy (bez wydania)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pobierz z dołu tej strony, sekcja Artifacts: \`kilometr-artifact-only-apk\`." >> "$GITHUB_STEP_SUMMARY"
          echo "W środku: \`$APK_NAME\` oraz \`$APK_NAME.sha256\`." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Wersja w APK: \`${{ steps.release.outputs.version }}\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          CHANNEL: ${{ steps.release.outputs.channel }}
          APK_NAME: ${{ steps.release.outputs.apk_name }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail
          # Build → zawsze nowy release z autogenerowanymi notkami. Bez
          # artefaktów do ręcznego szukania: APK jest assetem release'u.
          if [ "$CHANNEL" = "prod" ]; then
            TITLE="Kilometr $TAG"
          else
            TITLE="Kilometr nightly $TAG"
          fi

          PRERELEASE_FLAG=""
          if [ "$PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          ASSETS=(
            "apk-dist/${APK_NAME}#${APK_NAME}"
            "apk-dist/${APK_NAME}.sha256#${APK_NAME}.sha256"
          )
          if [ "$CHANNEL" = "prod" ]; then
            ASSETS+=(
              "apk-dist/app-release.apk#app-release.apk"
              "apk-dist/app-release.apk.sha256#app-release.apk.sha256"
            )
          fi

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG już istnieje, aktualizacja assetów i notek"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file apk-dist/release-notes.md
          else
            echo "Tworzenie nowego GitHub Release: $TAG"
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes-file apk-dist/release-notes.md \
              --target "${{ github.sha }}" \
              $PRERELEASE_FLAG \
              "${ASSETS[@]}"
          fi

          echo "Weryfikacja release '$TAG':"
          gh release view "$TAG" --json tagName,isPrerelease,assets \
            --jq '{tag: .tagName, prerelease: .isPrerelease, assets: [.assets[] | .name]}'

          URL="https://github.com/${GH_REPO}/releases/download/${TAG}/${APK_NAME}"
          echo "APK do pobrania: $URL"
          echo "### APK opublikowane ($CHANNEL)" >> "$GITHUB_STEP_SUMMARY"
          echo "[${APK_NAME}]($URL)" >> "$GITHUB_STEP_SUMMARY"
