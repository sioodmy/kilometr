name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  typecheck:
    name: App Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

  logic-tests:
    name: Logic Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run logic tests (RAPTOR routing engine)
        run: npm run check:routing

      - name: Run logic tests (Live transit matchers & geo)
        run: npm run check:live

      - name: Run logic tests (Offline tile packing & math)
        run: npm run check:tiles

      - name: Run logic tests (Places store & search migration)
        run: npm run check:places

      - name: Run logic tests (MPK Wrocław news parser)
        run: npm run check:mpk-news

      - name: Run logic tests (Kraków city)
        run: npm run check:krakow

      - name: Run logic tests (GZM Metropolis)
        run: npm run check:gzm

      - name: Run logic tests (Warszawa city)
        run: npm run check:warszawa

      - name: Run logic tests (Poznań city)
        run: npm run check:poznan

      - name: Run logic tests (Trójmiasto metropolis)
        run: npm run check:trojmiasto

      - name: Run logic tests (Łódź city)
        run: npm run check:lodz

      - name: Run logic tests (Szczecin city)
        run: npm run check:szczecin

      - name: Run logic tests (Kielce city)
        run: npm run check:kielce

      - name: Run logic tests (Olsztyn city)
        run: npm run check:olsztyn

      - name: Run logic tests (Białystok city)
        run: npm run check:bialystok

      - name: Run logic tests (Opole city)
        run: npm run check:opole

      - name: Run logic tests (Rzeszów city)
        run: npm run check:rzeszow

      - name: Run logic tests (Home pull gesture)
        run: npm run check:pull

  verify-subprojects:
    name: Lint & Typecheck Subprojects
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify subprojects (worker & scripts)
        run: npm run check:subprojects
