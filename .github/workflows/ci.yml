name: CI

on:
  push:
    branches: [dev, main, nightly, prod]
  pull_request:
    branches: [dev, main, nightly, prod]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref_name == 'dev' }}

jobs:
  static-app:
    name: App Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js & install dependencies
        uses: ./.github/actions/setup-node-ci

      - name: TypeScript & ESLint
        run: |
          set -euo pipefail
          npm run typecheck
          npm run lint

      - name: Node config & CI helper unit tests
        run: |
          set -euo pipefail
          node --test \
            scripts/check-android-version-code.test.mjs \
            .github/scripts/resolve-play-version.test.mjs

      - name: Localization & permission gates
        run: |
          set -euo pipefail
          npm run check:widget-strings
          npm run check:ios-strings
          npm run check:permission-gate
          npx expo config --type introspect --json > "$RUNNER_TEMP/expo-config.json"
          npm run check:android-permissions -- "$RUNNER_TEMP/expo-config.json" --expo-config

  static-subprojects:
    name: Subprojects & Dead Code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js & install root dependencies
        uses: ./.github/actions/setup-node-ci
        with:
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            landing/package-lock.json
            cloudflare/package-lock.json

      - name: Server build, typecheck & routing test
        run: |
          set -euo pipefail
          npm --prefix server ci
          npm --prefix server run build
          npm --prefix server run typecheck:scripts
          npm --prefix server test

      - name: Landing typecheck & Vite build
        run: |
          set -euo pipefail
          npm --prefix landing ci
          npm --prefix landing run build

      - name: Cloudflare Worker typecheck
        run: |
          set -euo pipefail
          npm --prefix cloudflare ci
          npm --prefix cloudflare run typecheck

      - name: Dead code check (Knip)
        run: npm run check:dead-code

  rust-raptor:
    name: Rust RAPTOR Engine
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust RAPTOR target
        uses: actions/cache@v5
        with:
          path: modules/kilometr-raptor/rust/target
          key: rust-raptor-ci-${{ runner.os }}-${{ hashFiles('modules/kilometr-raptor/rust/Cargo.toml', 'modules/kilometr-raptor/rust/src/**') }}
          restore-keys: |
            rust-raptor-ci-${{ runner.os }}-

      - name: Cargo check & tests
        run: |
          set -euo pipefail
          cargo check --locked --all-targets --manifest-path modules/kilometr-raptor/rust/Cargo.toml
          cargo test --locked --manifest-path modules/kilometr-raptor/rust/Cargo.toml

  fdroid-audit:
    name: F-Droid Prebuild & Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js & install dependencies
        uses: ./.github/actions/setup-node-ci

      - name: F-Droid baseline checks
        run: npm run check:fdroid

      - name: Verify prebuild:fdroid & permission allowlist
        env:
          APP_VERSION: v1.5.4
        run: |
          set -euo pipefail
          npm run prebuild:fdroid
          FDROID_BUILD=1 npm run check:fdroid
          FDROID_BUILD=1 npx expo config --type introspect --json > "$RUNNER_TEMP/fdroid-config.json"
          npm run check:android-permissions -- "$RUNNER_TEMP/fdroid-config.json" --expo-config

  test-unit:
    name: Unit & Cloudflare Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js & install dependencies
        uses: ./.github/actions/setup-node-ci

      - name: Run test/*.test.ts suite
        run: npm run test:unit

      - name: Run Cloudflare offline checks
        run: |
          set -euo pipefail
          for script in check:pois check:polska check:news check:stop-hints; do
            echo "::group::$script"
            npm run -s "$script"
            echo "::endgroup::"
          done

  test-routing:
    name: Routing, Search & Cities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js & install dependencies
        uses: ./.github/actions/setup-node-ci

      - name: Routing & search checks
        run: |
          set -euo pipefail
          for script in \
            check:routing \
            check:arrival \
            check:connections \
            check:boarded-routing \
            check:smart-rank \
            check:polinka \
            check:places \
            check:polish-inflections \
            check:search \
            check:search-speed \
            check:addresses
          do
            echo "::group::$script"
            npm run -s "$script"
            echo "::endgroup::"
          done

      - name: City transit adapter checks
        run: |
          set -euo pipefail
          for script in \
            check:warsaw \
            check:poznan \
            check:trojmiasto \
            check:lodz \
            check:szczecin \
            check:kielce \
            check:olsztyn \
            check:bialystok \
            check:opole \
            check:rzeszow \
            check:lublin \
            check:radom
          do
            echo "::group::$script"
            npm run -s "$script"
            echo "::endgroup::"
          done

  test-platform:
    name: Navigation, Live & Platform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js & install dependencies
        uses: ./.github/actions/setup-node-ci

      - name: Live tracking & transfer checks
        run: |
          set -euo pipefail
          for script in \
            check:live \
            check:rt-reliability \
            check:live-map-board \
            check:onboard-gps \
            check:onboard-detector \
            check:transfers \
            check:connection-times
          do
            echo "::group::$script"
            npm run -s "$script"
            echo "::endgroup::"
          done

      - name: Navigation, map & badge checks
        run: |
          set -euo pipefail
          for script in \
            check:nav \
            check:navigation-target \
            check:nav-map \
            check:minimap \
            check:geometry-cache \
            check:geometry-detour \
            check:map-colors \
            check:line-badge \
            check:line-timetable \
            check:widget-badge \
            check:personalization
          do
            echo "::group::$script"
            npm run -s "$script"
            echo "::endgroup::"
          done

      - name: Notifications, storage, sharing & iOS checks
        run: |
          set -euo pipefail
          for script in \
            check:notifications \
            check:alarm \
            check:notification-runtime \
            check:ios \
            check:ios-widgets \
            check:storage \
            check:kv-migration \
            check:offline-cache \
            check:backup \
            check:sharing \
            check:pull
          do
            echo "::group::$script"
            npm run -s "$script"
            echo "::endgroup::"
          done

  ci:
    name: CI Gate
    needs:
      - static-app
      - static-subprojects
      - rust-raptor
      - fdroid-audit
      - test-unit
      - test-routing
      - test-platform
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize & verify all CI checks
        env:
          RES_STATIC_APP: ${{ needs.static-app.result }}
          RES_SUBPROJECTS: ${{ needs.static-subprojects.result }}
          RES_RUST: ${{ needs.rust-raptor.result }}
          RES_FDROID: ${{ needs.fdroid-audit.result }}
          RES_UNIT: ${{ needs.test-unit.result }}
          RES_ROUTING: ${{ needs.test-routing.result }}
          RES_PLATFORM: ${{ needs.test-platform.result }}
        run: |
          set -euo pipefail
          {
            echo "### CI Summary"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| App Static Checks | \`$RES_STATIC_APP\` |"
            echo "| Subprojects & Dead Code | \`$RES_SUBPROJECTS\` |"
            echo "| Rust RAPTOR Engine | \`$RES_RUST\` |"
            echo "| F-Droid Prebuild & Audit | \`$RES_FDROID\` |"
            echo "| Unit & Cloudflare Tests | \`$RES_UNIT\` |"
            echo "| Routing, Search & Cities | \`$RES_ROUTING\` |"
            echo "| Navigation, Live & Platform | \`$RES_PLATFORM\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          for res in \
            "$RES_STATIC_APP" \
            "$RES_SUBPROJECTS" \
            "$RES_RUST" \
            "$RES_FDROID" \
            "$RES_UNIT" \
            "$RES_ROUTING" \
            "$RES_PLATFORM"
          do
            if [ "$res" != "success" ]; then
              echo "::error::Co najmniej jeden etap CI nie zakończył się sukcesem (status: $res)."
              exit 1
            fi
          done
