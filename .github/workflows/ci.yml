name: CI

on:
  pull_request:
    branches:
      - dev
      - main
      - nightly
      - prod
  push:
    branches:
      - dev
      - main
      - nightly
      - prod

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  typecheck:
    name: App Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        run: nix develop .#ci -c npm ci

      - name: Run TypeScript typecheck
        run: nix develop .#ci -c npm run typecheck

      - name: Check Android version codes
        run: nix develop .#ci -c node --test scripts/check-android-version-code.test.mjs

      - name: Check widget translations
        run: nix develop .#ci -c npm run check:widget-strings

      - name: Check iOS translations
        run: nix develop .#ci -c npm run check:ios-strings

      - name: Run ESLint
        run: nix develop .#ci -c npm run lint

      - name: Check Android permissions
        run: |
          nix develop .#ci -c bash -c '
            set -euo pipefail
            npm run check:permission-gate
            npx expo config --type introspect --json > "$RUNNER_TEMP/expo-config.json"
            npm run check:android-permissions -- "$RUNNER_TEMP/expo-config.json" --expo-config
          '

  fdroid-config:
    name: F-Droid Prebuild
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        run: nix develop .#ci -c npm ci

      - name: Check F-Droid
        run: nix develop .#ci -c npm run check:fdroid

      - name: Prepare unsigned F-Droid project
        run: nix develop .#ci -c bash -c "APP_VERSION=v1.5.4 npm run prebuild:fdroid"

      - name: Check F-Droid after prebuild
        run: nix develop .#ci -c bash -c "FDROID_BUILD=1 npm run check:fdroid"

      - name: Check F-Droid manifest
        env:
          FDROID_BUILD: '1'
          APP_VERSION: v1.5.4
        run: |
          nix develop .#ci -c bash -c '
            set -euo pipefail
            npx expo config --type introspect --json > "$RUNNER_TEMP/fdroid-config.json"
            npm run check:android-permissions -- "$RUNNER_TEMP/fdroid-config.json" --expo-config
          '

  logic-tests:
    name: Logic Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        run: nix develop .#ci -c npm ci

      - name: Cache Rust RAPTOR target
        uses: actions/cache@v4
        with:
          path: modules/kilometr-raptor/rust/target
          key: rust-raptor-ci-${{ runner.os }}-${{ hashFiles('modules/kilometr-raptor/rust/Cargo.toml', 'modules/kilometr-raptor/rust/src/**') }}
          restore-keys: |
            rust-raptor-ci-${{ runner.os }}-

      - name: Run Rust RAPTOR unit tests
        run: nix develop .#ci -c cargo test --manifest-path modules/kilometr-raptor/rust/Cargo.toml

      - name: Run logic tests (RAPTOR routing engine)
        run: nix develop .#ci -c npm run check:routing

      - name: Run logic tests (Arrive by)
        run: nix develop .#ci -c npm run check:arrival

      - name: Run logic tests (Duplicate connections)
        run: nix develop .#ci -c npm run check:connections

      - name: Run logic tests (Live transit matchers & geo)
        run: nix develop .#ci -c npm run check:live

      - name: Run logic tests (Polinka cable car)
        run: nix develop .#ci -c npm run check:polinka

      - name: Run logic tests (Backup format)
        run: nix develop .#ci -c npm run check:backup

      - name: Run logic tests (Journey sharing)
        run: nix develop .#ci -c npm run check:sharing

      - name: Run logic tests (Storage)
        run: nix develop .#ci -c npm run check:storage

      - name: Run logic tests (KV migration)
        run: nix develop .#ci -c npm run check:kv-migration

      - name: Run logic tests (Offline cache)
        run: nix develop .#ci -c npm run check:offline-cache

      - name: Run logic tests (Places per city)
        run: nix develop .#ci -c npm run check:places

      - name: Run logic tests (Address search)
        run: nix develop .#ci -c npm run check:search

      - name: Run logic tests (Offline address index)
        run: nix develop .#ci -c npm run check:addresses

      - name: Run logic tests (Warsaw city)
        run: nix develop .#ci -c npm run check:warsaw

      - name: Run logic tests (Poznań city)
        run: nix develop .#ci -c npm run check:poznan

      - name: Run logic tests (Tricity)
        run: nix develop .#ci -c npm run check:trojmiasto

      - name: Run logic tests (Łódź city)
        run: nix develop .#ci -c npm run check:lodz

      - name: Run logic tests (Szczecin city)
        run: nix develop .#ci -c npm run check:szczecin

      - name: Run logic tests (Kielce city)
        run: nix develop .#ci -c npm run check:kielce

      - name: Run logic tests (Olsztyn city)
        run: nix develop .#ci -c npm run check:olsztyn

      - name: Run logic tests (Białystok city)
        run: nix develop .#ci -c npm run check:bialystok

      - name: Run logic tests (Opole city)
        run: nix develop .#ci -c npm run check:opole

      - name: Run logic tests (Rzeszów city)
        run: nix develop .#ci -c npm run check:rzeszow

      - name: Run logic tests (Lublin city)
        run: nix develop .#ci -c npm run check:lublin

      - name: Run logic tests (Radom city)
        run: nix develop .#ci -c npm run check:radom

      - name: Run logic tests (Home pull gesture)
        run: nix develop .#ci -c npm run check:pull

      - name: Run logic tests (Notifications)
        run: nix develop .#ci -c npm run check:notifications

      - name: Run logic tests (Departure alarm)
        run: nix develop .#ci -c npm run check:alarm

      - name: Run logic tests (Notification lifecycle)
        run: nix develop .#ci -c npm run check:notification-runtime

      - name: Run iOS notification tests
        run: nix develop .#ci -c npm run check:ios

      - name: Run widget snapshot tests
        run: nix develop .#ci -c npm run check:ios-widgets

      - name: Run logic tests (Smart rank)
        run: nix develop .#ci -c npm run check:smart-rank

      - name: Run logic tests (Navigation target)
        run: nix develop .#ci -c npm run check:navigation-target

      - name: Check navigation map loading and GPS camera
        run: nix develop .#ci -c npm run check:nav-map

      - name: Run logic tests (Navigation)
        run: nix develop .#ci -c npm run check:nav

      - name: Run logic tests (Minimap)
        run: nix develop .#ci -c npm run check:minimap

      - name: Run logic tests (Geometry cache)
        run: nix develop .#ci -c npm run check:geometry-cache

      - name: Run logic tests (Map colors)
        run: nix develop .#ci -c npm run check:map-colors

      - name: Run logic tests (Personalization)
        run: nix develop .#ci -c npm run check:personalization

  verify-subprojects:
    name: Lint & Typecheck Subprojects
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-subprojects-${{ runner.os }}-${{ hashFiles('package-lock.json', 'server/package-lock.json', 'landing/package-lock.json', 'cloudflare/package-lock.json') }}
          restore-keys: |
            npm-subprojects-${{ runner.os }}-

      - name: Install shared app dependencies
        run: nix develop .#ci -c npm ci

      - name: Build & typecheck server
        run: |
          nix develop .#ci -c bash -c '
            set -euo pipefail
            npm --prefix server ci
            npm --prefix server run build
          '

      - name: Build & typecheck landing
        run: |
          nix develop .#ci -c bash -c '
            set -euo pipefail
            npm --prefix landing ci
            npm --prefix landing run build
          '

      - name: Typecheck Cloudflare
        run: |
          nix develop .#ci -c bash -c '
            set -euo pipefail
            npm --prefix cloudflare ci
            npm --prefix cloudflare run typecheck
          '

      - name: Check unused code and dependencies
        run: nix develop .#ci -c npm run check:dead-code
