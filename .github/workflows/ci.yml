name: CI

on:
  pull_request:
    branches:
      - dev
      - main
      - nightly
      - prod
  push:
    branches:
      - dev
      - main
      - nightly
      - prod

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: App Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

  logic-tests:
    name: Logic Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust RAPTOR target
        uses: actions/cache@v6
        with:
          path: modules/kilometr-raptor/rust/target
          key: rust-raptor-ci-${{ runner.os }}-${{ hashFiles('modules/kilometr-raptor/rust/Cargo.toml', 'modules/kilometr-raptor/rust/src/**') }}
          restore-keys: |
            rust-raptor-ci-${{ runner.os }}-

      - name: Run Rust RAPTOR unit tests
        run: cargo test --manifest-path modules/kilometr-raptor/rust/Cargo.toml

      - name: Run logic tests (RAPTOR routing engine)
        run: npm run check:routing

      - name: Run logic tests (Live transit matchers & geo)
        run: npm run check:live

      - name: Run logic tests (Polinka cable car)
        run: npm run check:polinka

      - name: Run logic tests (Backup format)
        run: npm run check:backup

      - name: Run logic tests (Places per city)
        run: npm run check:places

      - name: Run logic tests (Warsaw city)
        run: npm run check:warsaw

      - name: Run logic tests (Poznań city)
        run: npm run check:poznan

      - name: Run logic tests (Tricity)
        run: npm run check:trojmiasto

      - name: Run logic tests (Łódź city)
        run: npm run check:lodz

      - name: Run logic tests (Szczecin city)
        run: npm run check:szczecin

      - name: Run logic tests (Kielce city)
        run: npm run check:kielce

      - name: Run logic tests (Olsztyn city)
        run: npm run check:olsztyn

      - name: Run logic tests (Białystok city)
        run: npm run check:bialystok

      - name: Run logic tests (Opole city)
        run: npm run check:opole

      - name: Run logic tests (Rzeszów city)
        run: npm run check:rzeszow

      - name: Run logic tests (Lublin city)
        run: npm run check:lublin

      - name: Run logic tests (Radom city)
        run: npm run check:radom

      - name: Run logic tests (Home pull gesture)
        run: npm run check:pull

      - name: Run logic tests (Notifications)
        run: npm run check:notifications

      - name: Run logic tests (Smart rank)
        run: npm run check:smart-rank

      - name: Run logic tests (Navigation target)
        run: npm run check:navigation-target

      - name: Run logic tests (Navigation)
        run: npm run check:nav

      - name: Run logic tests (Minimap)
        run: npm run check:minimap

      - name: Run logic tests (Geometry cache)
        run: npm run check:geometry-cache

  verify-subprojects:
    name: Lint & Typecheck Subprojects
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            landing/package-lock.json

      - name: Build & typecheck server
        run: |
          npm --prefix server ci
          npm --prefix server run build

      - name: Build & typecheck landing
        run: |
          npm --prefix landing ci
          npm --prefix landing run build
