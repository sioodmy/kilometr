name: Release APK

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag wydania (np. v1.1.0)'
        required: false

permissions:
  contents: write

concurrency:
  group: "release-apk"
  cancel-in-progress: false

env:
  ANDROID_COMPILE_SDK: '36'
  ANDROID_BUILD_TOOLS: '36.0.0'
  ANDROID_NDK: '27.1.12297006'
  ANDROID_CMAKE: '3.30.5'

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK platforms, build-tools, NDK and CMake
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}" \
            "cmake;${ANDROID_CMAKE}"

      - name: Install Node dependencies
        run: npm ci

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean --no-install

      - name: Tune Gradle for CI
        run: |
          set -euo pipefail
          GP=android/gradle.properties
          printf '\n' >> "$GP"
          cat >> "$GP" <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
          org.gradle.caching=true
          EOF

      - name: Build Android Release APK (All Architectures)
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -x lint --no-daemon --console=plain --stacktrace

      - name: Resolve Release Tag
        id: vars
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo "v$(node -p 'require("./package.json").version')")"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG"

      - name: Verify and stage APK
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail
          APK=$(ls -1 android/app/build/outputs/apk/release/*.apk | head -n 1)
          if [ -z "$APK" ]; then
            echo "Nie znaleziono żadnego APK w android/app/build/outputs/apk/release"
            exit 1
          fi
          echo "Zbudowano: $APK ($(du -h "$APK" | cut -f1))"
          mkdir -p apk-dist
          cp "$APK" "apk-dist/kilometr-${TAG}.apk"
          cp "$APK" "apk-dist/app-release.apk"
          (cd apk-dist && sha256sum "kilometr-${TAG}.apk" > "kilometr-${TAG}.apk.sha256")
          (cd apk-dist && sha256sum "app-release.apk" > "app-release.apk.sha256")

      - name: Generate Release Notes from Conventional Commits
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail
          node .github/scripts/generate-release-notes.mjs \
            --tag "$TAG" \
            --output "apk-dist/release-notes.md" \
            --sha-file "apk-dist/kilometr-${TAG}.apk.sha256"
          echo "--- Wygenerowane Release Notes ---"
          cat apk-dist/release-notes.md

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kilometr-release-apk
          path: apk-dist/*

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail
          echo "Publikowanie release dla tagu: $TAG"

          if ! gh release view "$TAG" > /dev/null 2>&1; then
            echo "Tworzenie nowego GitHub Release: $TAG"
            gh release create "$TAG" \
              --title "Kilometr $TAG" \
              --notes-file "apk-dist/release-notes.md" \
              "apk-dist/kilometr-${TAG}.apk#kilometr-${TAG}.apk" \
              "apk-dist/kilometr-${TAG}.apk.sha256#kilometr-${TAG}.apk.sha256"
          else
            echo "Release $TAG już istnieje, aktualizacja assetów i notatek"
            gh release upload "$TAG" \
              "apk-dist/kilometr-${TAG}.apk#kilometr-${TAG}.apk" \
              "apk-dist/kilometr-${TAG}.apk.sha256#kilometr-${TAG}.apk.sha256" \
              --clobber
            gh release edit "$TAG" \
              --title "Kilometr $TAG" \
              --notes-file "apk-dist/release-notes.md"
          fi

          echo "Synchronizacja release 'latest'..."
          if ! gh release view latest > /dev/null 2>&1; then
            gh release create latest \
              --title "Kilometr $TAG (latest)" \
              --notes "Najnowsza wersja: [$TAG](https://github.com/${GH_REPO}/releases/tag/$TAG)"
          else
            gh release edit latest \
              --title "Kilometr $TAG (latest)" \
              --notes "Najnowsza wersja: [$TAG](https://github.com/${GH_REPO}/releases/tag/$TAG)"
          fi
          gh release upload latest "apk-dist/app-release.apk#app-release.apk" --clobber
          gh release upload latest "apk-dist/app-release.apk.sha256#app-release.apk.sha256" --clobber
          echo "Sukces: APK i suma SHA256 zostały opublikowane w GitHub Release!"
