name: Propozycja funkcji
description: Zaproponuj nową funkcję lub ulepszenie Kilometra
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Pomysł
      description: Co chciałbyś dodać albo zmienić?
      placeholder: Widget z odjazdami ulubionej linii na pulpicie...
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Po co
      description: Jaki problem to rozwiązuje? Pomiń, jeśli oczywiste.
      placeholder: Muszę odblokowywać telefon, żeby sprawdzić, za ile jedzie tramwaj...
    validations:
      required: false

  - type: textarea
    id: mockups
    attributes:
      label: Makiety / inspiracje
      description: Wrzuć szkice albo przykłady, jeśli masz.
      placeholder: Przeciągnij pliki tutaj...
    validations:
      required: false
