name: Błąd rozkładu / trasy / GTFS
description: Zgłoś błąd w rozkładzie jazdy, trasie, braku kursu lub lokalizacji przystanku
title: "[Transit]: "
labels: ["transit-data"]
body:
  - type: input
    id: line_and_stops
    attributes:
      label: Linia i przystanki
      description: Numer linii i przystanki (początkowy, przesiadkowy, końcowy).
      placeholder: Tramwaj 10, Rynek -> Plac Grunwaldzki
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Co jest nie tak
      description: Co pokazała aplikacja, a jak jest naprawdę. Dopisz datę i godzinę, jeśli ma znaczenie.
      placeholder: Kilometr sugerował odjazd o 14:32, a tego kursu nie ma w rozkładzie...
    validations:
      required: true

  - type: textarea
    id: media
    attributes:
      label: Zrzuty ekranu / zdjęcia rozkładu
      description: Wrzuć zrzut albo zdjęcie tablicy, jeśli masz.
      placeholder: Przeciągnij pliki tutaj...
    validations:
      required: false
