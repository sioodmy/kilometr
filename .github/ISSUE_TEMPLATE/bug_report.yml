name: Zgłoszenie błędu
description: Zgłoś błąd, awarię albo niespodziewane zachowanie w Kilometrze
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Co się stało
      description: Opisz błąd. Dopisz wersję aplikacji i model telefonu, jeśli je znasz.
      placeholder: Po zablokowaniu ekranu widżet nie aktualizuje najbliższego odjazdu...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Jak to odtworzyć
      description: Kroki prowadzące do błędu. Pomiń, jeśli nie wiesz.
      placeholder: |
        1. Otwórz aplikację
        2. Przejdź do ...
        3. Zauważ błąd
    validations:
      required: false

  - type: textarea
    id: media
    attributes:
      label: Zrzuty ekranu / logi
      description: Wrzuć zrzut albo logi, jeśli masz.
      placeholder: Przeciągnij pliki tutaj...
    validations:
      required: false
